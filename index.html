<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StockMap Inventory</title>
<meta name="description" content="Track exactly where each size is stored, by location." />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1B2430" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="StockMap" />
<style>
  :root {
    --ink: #1B2430; --amber: #E8A33D; --amber-deep: #C97F1E;
    --paper: #F2F0EA; --slate: #5C6470; --green: #4A7C59; --red: #B5493A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--paper); }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: var(--ink); }

  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px;
            background: var(--ink); color: var(--paper); position: sticky; top: 0; z-index: 20; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark { background: var(--amber); color: var(--ink); width: 34px; height: 34px; border-radius: 8px;
                display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; flex-shrink: 0; }
  .brand-title { font-weight: 700; letter-spacing: .06em; font-size: 15px; }
  .brand-sub { font-size: 10.5px; color: #9AA5B5; }
  .topbar-actions { display: flex; gap: 8px; }

  button { font-family: inherit; }
  .btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600;
         padding: 9px 12px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; }
  .btn:disabled { opacity: .4; }
  .btn-primary { background: var(--amber); color: var(--ink); }
  .btn-ghost { background: transparent; color: var(--paper); border-color: rgba(242,240,234,.3); }
  .modal-actions .btn-ghost { color: var(--ink); border-color: #D8D4C8; }
  .btn-sm { padding: 6px 10px; font-size: 12px; }
  .btn-full { width: 100%; justify-content: center; }

  .stats-strip { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: #DAD6C9; }
  .stat { background: var(--paper); padding: 12px 16px; }
  .stat-num { font-size: 22px; font-weight: 700; display: block; }
  .stat-label { font-size: 10.5px; color: var(--slate); text-transform: uppercase; }
  .stat-warn .stat-num { color: var(--red); }

  .filters { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 0; }
  .search-box { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #DAD6C9;
                border-radius: 8px; padding: 10px 12px; }
  .search-box input { border: none; outline: none; flex: 1; font-size: 15px; background: transparent; }
  .filters select { border: 1px solid #DAD6C9; border-radius: 8px; padding: 10px; font-size: 14px; background: #fff; width: 100%; }

  .content { padding: 16px; }
  .card { background: #fff; border: 1px solid #E4E0D3; border-radius: 12px; padding: 16px; margin-bottom: 14px; position: relative; }
  .card-head { display: flex; align-items: flex-start; gap: 10px; padding-bottom: 12px;
               border-bottom: 1px dashed #E4E0D3; margin-bottom: 12px; flex-wrap: wrap; }
  .card-eyebrow { font-size: 10.5px; color: var(--slate); text-transform: uppercase; }
  .card-title { font-size: 17px; margin: 2px 0 0; font-weight: 700; }
  .card-total { margin-left: auto; text-align: right; }
  .card-total-num { font-size: 20px; font-weight: 700; color: var(--amber-deep); display: block; }
  .card-total-label { font-size: 10px; color: var(--slate); text-transform: uppercase; }
  .card-delete { position: absolute; top: 12px; right: 12px; }

  .size-group { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
  .size-badge { min-width: 36px; height: 36px; background: var(--ink); color: var(--paper); border-radius: 8px;
                display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0; }
  .bintag-row { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
  .bintag-wrap { display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .bintag { position: relative; background: repeating-linear-gradient(135deg,#FFF7E8,#FFF7E8 6px,#FCEFD4 6px,#FCEFD4 12px);
            border: 1.5px solid var(--amber-deep); border-radius: 6px; padding: 6px 10px 6px 14px; min-width: 80px; text-align: center; }
  .bintag-notch { position: absolute; left: -5px; top: 50%; transform: translateY(-50%); width: 9px; height: 9px;
                  background: var(--paper); border: 1.5px solid var(--amber-deep); border-radius: 50%; }
  .bintag-code { font-weight: 700; font-size: 12.5px; }
  .bintag-label { font-size: 9.5px; color: var(--slate); }
  .bintag-meta { display: flex; align-items: center; gap: 4px; }

  .pill { font-size: 10.5px; font-weight: 600; padding: 3px 7px; border-radius: 20px; background: #EAF2EC; color: var(--green); }
  .pill-low { background: #FCEEDC; color: var(--amber-deep); }
  .pill-out { background: #F8E4E0; color: var(--red); }

  .icon-btn { background: transparent; border: none; cursor: pointer; color: var(--slate);
              display: inline-flex; align-items: center; justify-content: center; padding: 6px; border-radius: 6px; font-size: 15px; }
  .icon-btn.tiny { padding: 2px; font-size: 12px; }
  .icon-btn:disabled { opacity: .3; }

  .empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 60px 20px; gap: 10px; color: var(--slate); }
  .empty-state h2 { color: var(--ink); margin: 6px 0 0; font-size: 18px; }
  .empty-state p { max-width: 320px; font-size: 13.5px; line-height: 1.5; margin: 0 0 8px; }
  .empty-inline { text-align: center; padding: 40px 0; color: var(--slate); font-size: 13.5px; }

  .save-indicator { position: fixed; bottom: 12px; right: 14px; font-size: 10.5px;
                     color: var(--slate); background: #fff; border: 1px solid #E4E0D3; padding: 4px 9px; border-radius: 20px; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(27,36,48,.55); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal { background: #fff; border-radius: 16px 16px 0 0; width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid #EEEAE0; position: sticky; top: 0; background: #fff; }
  .modal-head h3 { margin: 0; font-size: 16px; }
  .modal-body { padding: 16px 18px 22px; }

  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; font-size: 12px; color: var(--slate); font-weight: 600; }
  .field input, .field select { border: 1px solid #DAD6C9; border-radius: 8px; padding: 11px; font-size: 16px; color: var(--ink); outline: none; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; padding: 10px; background: #FAF9F5; border-radius: 8px; border: 1px solid #EEEAE0; }
  .row input, .row select { border: 1px solid #DAD6C9; border-radius: 6px; padding: 9px; font-size: 15px; outline: none; }
  .row select { grid-column: 1 / -1; }
  .row-bottom { display: flex; gap: 8px; grid-column: 1 / -1; align-items: center; justify-content: flex-end; }

  .modal-actions { display: flex; flex-direction: column-reverse; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid #EEEAE0; }
  .modal-actions .btn { width: 100%; justify-content: center; }
</style>
</head>
<body>

<div id="app"></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "stockmap_db_v1";
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function loadDB() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { items: [], locations: [], stock: [] };
  }
  function saveDB(db) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) {}
  }

  var db = loadDB();
  var ui = { query: "", locationFilter: "", modal: null };

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    for (var key in attrs) {
      if (key === "class") node.className = attrs[key];
      else if (key === "html") node.innerHTML = attrs[key];
      else if (key.indexOf("on") === 0 && typeof attrs[key] === "function") {
        node.addEventListener(key.slice(2).toLowerCase(), attrs[key]);
      } else if (key === "value") node.value = attrs[key];
      else node.setAttribute(key, attrs[key]);
    }
    (children || []).forEach(function (c) {
      if (c === null || c === undefined) return;
      if (typeof c === "string") node.appendChild(document.createTextNode(c));
      else node.appendChild(c);
    });
    return node;
  }

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function render() {
    var root = document.getElementById("app");
    root.innerHTML = "";
    root.appendChild(buildApp());
    if (ui.modal) root.appendChild(ui.modal());
  }

  function totalUnits() { return db.stock.reduce(function (s, r) { return s + r.qty; }, 0); }
  function lowCount() { return db.stock.filter(function (r) { return r.qty <= 3; }).length; }
  function locationsById() {
    var map = {};
    db.locations.forEach(function (l) { map[l.id] = l; });
    return map;
  }

  function filteredItems() {
    var q = ui.query.trim().toLowerCase();
    return db.items.filter(function (it) {
      var matchesQuery = !q ||
        it.name.toLowerCase().indexOf(q) !== -1 ||
        (it.sku || "").toLowerCase().indexOf(q) !== -1 ||
        (it.category || "").toLowerCase().indexOf(q) !== -1;
      var rows = db.stock.filter(function (s) { return s.itemId === it.id; });
      var matchesLoc = !ui.locationFilter || rows.some(function (r) { return r.locationId === ui.locationFilter; });
      return matchesQuery && matchesLoc;
    });
  }

  function buildApp() {
    var shell = el("div", {}, [
      buildTopbar(),
      buildStats(),
      buildFilters(),
      buildContent(),
      el("div", { class: "save-indicator" }, ["Saved on this device"])
    ]);
    return shell;
  }

  function buildTopbar() {
    return el("header", { class: "topbar" }, [
      el("div", { class: "brand" }, [
        el("div", { class: "brand-mark" }, ["S"]),
        el("div", {}, [
          el("div", { class: "brand-title" }, ["STOCKMAP"]),
          el("div", { class: "brand-sub" }, ["size & location tracker"])
        ])
      ]),
      el("div", { class: "topbar-actions" }, [
        el("button", { class: "btn btn-ghost", onClick: function () { ui.modal = addLocationModal(); render(); } }, ["📍"]),
        el("button", { class: "btn btn-primary", onClick: function () { ui.modal = addItemModal(); render(); } }, ["+ Add"])
      ])
    ]);
  }

  function buildStats() {
    function stat(num, label, warn) {
      return el("div", { class: "stat" + (warn ? " stat-warn" : "") }, [
        el("span", { class: "stat-num" }, [String(num)]),
        el("span", { class: "stat-label" }, [label])
      ]);
    }
    return el("div", { class: "stats-strip" }, [
      stat(db.items.length, "Products"),
      stat(db.locations.length, "Locations"),
      stat(totalUnits(), "Total units"),
      stat(lowCount(), "Low / out lines", true)
    ]);
  }

  function buildFilters() {
    var searchInput = el("input", {
      placeholder: "Search product, SKU, category…",
      value: ui.query,
      onInput: function (e) { ui.query = e.target.value; renderContentOnly(); }
    });
    var select = el("select", {
      onChange: function (e) { ui.locationFilter = e.target.value; renderContentOnly(); }
    }, [el("option", { value: "" }, ["All locations"])].concat(
      db.locations.map(function (l) {
        var opt = el("option", { value: l.id }, [l.code + (l.label ? " — " + l.label : "")]);
        if (l.id === ui.locationFilter) opt.selected = true;
        return opt;
      })
    ));
    return el("div", { class: "filters", id: "filters" }, [
      el("div", { class: "search-box" }, [el("span", {}, ["🔍"]), searchInput]),
      select
    ]);
  }

  function renderContentOnly() {
    var old = document.getElementById("content-area");
    if (old) old.replaceWith(buildContent());
  }

  function buildContent() {
    var wrap = el("main", { class: "content", id: "content-area" });
    if (db.items.length === 0) {
      wrap.appendChild(emptyState());
      return wrap;
    }
    var items = filteredItems();
    if (items.length === 0) {
      wrap.appendChild(el("div", { class: "empty-inline" }, ["No products match your search."]));
      return wrap;
    }
    var locMap = locationsById();
    items.forEach(function (item) {
      var rows = db.stock.filter(function (s) { return s.itemId === item.id; });
      wrap.appendChild(itemCard(item, rows, locMap));
    });
    return wrap;
  }

  function emptyState() {
    return el("div", { class: "empty-state" }, [
      el("div", {}, ["📦"]),
      el("h2", {}, ["No products yet"]),
      el("p", {}, ["Add your first product, give it sizes, and pin exactly which shelf, rack, or bin each size lives in."]),
      el("button", { class: "btn btn-primary", onClick: function () { ui.modal = addItemModal(); render(); } }, ["+ Add your first product"])
    ]);
  }

  function stockPill(qty) {
    var cls = "pill";
    var prefix = "";
    if (qty === 0) { cls += " pill-out"; prefix = "⚠ "; }
    else if (qty <= 3) { cls += " pill-low"; }
    return el("span", { class: cls }, [prefix + qty + " " + (qty === 1 ? "unit" : "units")]);
  }

  function itemCard(item, rows, locMap) {
    var bySize = {};
    rows.forEach(function (r) {
      if (!bySize[r.size]) bySize[r.size] = [];
      bySize[r.size].push(r);
    });
    var sizeKeys = Object.keys(bySize).sort();

    var card = el("div", { class: "card" }, [
      el("button", {
        class: "icon-btn card-delete",
        onClick: function () {
          db.items = db.items.filter(function (i) { return i.id !== item.id; });
          db.stock = db.stock.filter(function (s) { return s.itemId !== item.id; });
          saveDB(db);
          render();
        }
      }, ["🗑"]),
      el("div", { class: "card-head" }, [
        el("div", {}, [
          el("div", { class: "card-eyebrow" }, [(item.sku || "NO-SKU") + (item.category ? " · " + item.category : "")]),
          el("h3", { class: "card-title" }, [item.name])
        ]),
        el("div", { class: "card-total" }, [
          el("span", { class: "card-total-num" }, [String(rows.reduce(function (s, r) { return s + r.qty; }, 0))]),
          el("span", { class: "card-total-label" }, ["total units"])
        ])
      ])
    ]);

    sizeKeys.forEach(function (size) {
      var tagRow = el("div", { class: "bintag-row" });
      bySize[size].forEach(function (r) {
        var loc = locMap[r.locationId];
        tagRow.appendChild(el("div", { class: "bintag-wrap" }, [
          el("div", { class: "bintag" }, [
            el("div", { class: "bintag-notch" }),
            el("div", { class: "bintag-code" }, [loc ? loc.code : "?"]),
            loc && loc.label ? el("div", { class: "bintag-label" }, [loc.label]) : null
          ]),
          el("div", { class: "bintag-meta" }, [
            stockPill(r.qty),
            el("button", {
              class: "icon-btn tiny",
              onClick: function () {
                db.stock = db.stock.filter(function (s) { return s.id !== r.id; });
                saveDB(db);
                render();
              }
            }, ["✕"])
          ])
        ]));
      });
      card.appendChild(el("div", { class: "size-group" }, [
        el("div", { class: "size-badge" }, [size]),
        tagRow
      ]));
    });

    return card;
  }

  // ---------- Modals ----------

  function closeModal() { ui.modal = null; render(); }

  function modalShell(title, bodyChildren) {
    return function () {
      return el("div", { class: "modal-backdrop", onClick: function (e) { if (e.target === e.currentTarget) closeModal(); } }, [
        el("div", { class: "modal" }, [
          el("div", { class: "modal-head" }, [
            el("h3", {}, [title]),
            el("button", { class: "icon-btn", onClick: closeModal }, ["✕"])
          ]),
          el("div", { class: "modal-body" }, bodyChildren)
        ])
      ]);
    };
  }

  function addLocationModal(onCreated) {
    var codeVal = "", labelVal = "";
    function body() {
      var codeInput = el("input", {
        placeholder: "e.g. A1-03",
        value: codeVal,
        onInput: function (e) { codeVal = e.target.value.toUpperCase(); e.target.value = codeVal; }
      });
      var labelInput = el("input", {
        placeholder: "e.g. Warehouse A, Rack 1, Shelf 3",
        value: labelVal,
        onInput: function (e) { labelVal = e.target.value; }
      });
      var saveBtn = el("button", {
        class: "btn btn-primary",
        onClick: function () {
          if (!codeVal.trim()) return;
          var loc = { id: uid(), code: codeVal.trim(), label: labelVal.trim() };
          db.locations.push(loc);
          saveDB(db);
          if (onCreated) onCreated(loc);
          closeModal();
        }
      }, ["Add location"]);
      return [
        el("label", { class: "field" }, [el("span", {}, ["Location code"]), codeInput]),
        el("label", { class: "field" }, [el("span", {}, ["Description (optional)"]), labelInput]),
        el("div", { class: "modal-actions" }, [
          saveBtn,
          el("button", { class: "btn btn-ghost", onClick: closeModal }, ["Cancel"])
        ])
      ];
    }
    return modalShell("Add a location", body());
  }

  function addItemModal() {
    var sku = "", name = "", category = "";
    var rows = [{ id: uid(), size: "", locationId: "", qty: "" }];

    function body() {
      var skuInput = el("input", { placeholder: "TSH-001", value: sku, onInput: function (e) { sku = e.target.value; } });
      var catInput = el("input", { placeholder: "T-Shirts", value: category, onInput: function (e) { category = e.target.value; } });
      var nameInput = el("input", { placeholder: "Classic Crew Tee", value: name, onInput: function (e) { name = e.target.value; } });

      var rowsWrap = el("div", {});
      rows.forEach(function (r, idx) {
        var sizeInput = el("input", { placeholder: "Size (e.g. M)", value: r.size, onInput: function (e) { r.size = e.target.value; } });
        var qtyInput = el("input", { type: "number", min: "0", placeholder: "Qty", value: r.qty, onInput: function (e) { r.qty = e.target.value; } });
        var locSelect = el("select", {
          onChange: function (e) {
            if (e.target.value === "__new__") {
              ui.modal = addLocationModal(function (newLoc) {
                r.locationId = newLoc.id;
                ui.modal = modalShell("Add a product", body());
                render();
              });
              render();
              return;
            }
            r.locationId = e.target.value;
          }
        }, [el("option", { value: "" }, ["Select location…"])].concat(
          db.locations.map(function (l) {
            var opt = el("option", { value: l.id }, [l.code + (l.label ? " — " + l.label : "")]);
            if (l.id === r.locationId) opt.selected = true;
            return opt;
          })
        ).concat([el("option", { value: "__new__" }, ["+ New location…"])]));

        var removeBtn = el("button", {
          class: "icon-btn",
          onClick: function () {
            rows = rows.filter(function (x) { return x.id !== r.id; });
            ui.modal = modalShell("Add a product", body());
            render();
          }
        }, ["🗑"]);
        if (rows.length === 1) removeBtn.disabled = true;

        rowsWrap.appendChild(el("div", { class: "row" }, [
          sizeInput, qtyInput, locSelect,
          el("div", { class: "row-bottom" }, [removeBtn])
        ]));
      });

      var addRowBtn = el("button", {
        class: "btn btn-ghost btn-sm",
        onClick: function () {
          rows.push({ id: uid(), size: "", locationId: "", qty: "" });
          ui.modal = modalShell("Add a product", body());
          render();
        }
      }, ["+ Add another size / location"]);

      var canSave = name.trim() && rows.some(function (r) { return r.size.trim() && r.locationId && r.qty !== "" && Number(r.qty) >= 0; });
      var saveBtn = el("button", {
        class: "btn btn-primary",
        onClick: function () {
          if (!canSave) return;
          var item = { id: uid(), sku: sku.trim(), name: name.trim(), category: category.trim(), createdAt: Date.now() };
          db.items.push(item);
          rows.forEach(function (r) {
            if (!r.size.trim() || !r.locationId || r.qty === "") return;
            db.stock.push({ id: uid(), itemId: item.id, locationId: r.locationId, size: r.size.trim(), qty: Number(r.qty) });
          });
          saveDB(db);
          closeModal();
        }
      }, ["Save product"]);
      if (!canSave) saveBtn.disabled = true;

      return [
        el("div", { class: "grid-2" }, [
          el("label", { class: "field" }, [el("span", {}, ["SKU (optional)"]), skuInput]),
          el("label", { class: "field" }, [el("span", {}, ["Category (optional)"]), catInput])
        ]),
        el("label", { class: "field" }, [el("span", {}, ["Product name"]), nameInput]),
        rowsWrap,
        addRowBtn,
        el("div", { class: "modal-actions" }, [
          saveBtn,
          el("button", { class: "btn btn-ghost", onClick: closeModal }, ["Cancel"])
        ])
      ];
    }

    return modalShell("Add a product", body());
  }

  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
