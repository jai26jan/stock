<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StockMap Inventory</title>
<meta name="description" content="Track exactly where each size is stored, by location." />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1B2430" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="StockMap" />
<style>
  :root {
    --ink: #1B2430; --amber: #E8A33D; --amber-deep: #C97F1E;
    --paper: #F2F0EA; --slate: #5C6470; --green: #4A7C59; --red: #B5493A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--paper); }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: var(--ink); }

  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px;
            background: var(--ink); color: var(--paper); position: sticky; top: 0; z-index: 20; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark { background: var(--amber); color: var(--ink); width: 34px; height: 34px; border-radius: 8px;
                display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; flex-shrink: 0; }
  .brand-title { font-weight: 700; letter-spacing: .06em; font-size: 15px; }
  .brand-sub { font-size: 10.5px; color: #9AA5B5; }
  .sync-indicator { font-size: 10.5px; cursor: default; }
  .sync-idle { color: #7FBF8E; }
  .sync-syncing { color: #E8A33D; }
  .sync-error, .sync-offline { color: #E8867A; cursor: pointer; text-decoration: underline; }
  .topbar-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

  button { font-family: inherit; }
  .btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600;
         padding: 9px 12px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; }
  .btn:disabled { opacity: .4; }
  .btn-primary { background: var(--amber); color: var(--ink); }
  .btn-ghost { background: transparent; color: var(--paper); border-color: rgba(242,240,234,.3); }
  .modal-actions .btn-ghost { color: var(--ink); border-color: #D8D4C8; }
  .modal-actions .btn-danger { color: var(--red); border-color: #E8C9C3; }
  .modal-actions .btn-danger-solid { background: var(--red); color: #fff; }
  .btn-sm { padding: 6px 10px; font-size: 12px; }
  .btn-full { width: 100%; justify-content: center; }

  .stats-strip { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: #DAD6C9; }
  .stat { background: var(--paper); padding: 12px 16px; }
  .stat-num { font-size: 22px; font-weight: 700; display: block; }
  .stat-label { font-size: 10.5px; color: var(--slate); text-transform: uppercase; }
  .stat-warn .stat-num { color: var(--red); }

  .filters { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 0; }
  .search-box { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #DAD6C9;
                border-radius: 8px; padding: 10px 12px; }
  .search-box input { border: none; outline: none; flex: 1; font-size: 15px; background: transparent; }
  .filters select { border: 1px solid #DAD6C9; border-radius: 8px; padding: 10px; font-size: 14px; background: #fff; width: 100%; }

  .content { padding: 16px; }
  .card { background: #fff; border: 1px solid #E4E0D3; border-radius: 12px; padding: 16px; margin-bottom: 14px; position: relative; }
  .card-actions-top { position: absolute; top: 10px; right: 10px; display: flex; gap: 2px; }
  .card-head { display: flex; align-items: flex-start; gap: 10px; padding-bottom: 12px; padding-right: 78px;
               border-bottom: 1px dashed #E4E0D3; margin-bottom: 12px; flex-wrap: wrap; }
  .card-eyebrow { font-size: 10.5px; color: var(--slate); text-transform: uppercase; }
  .card-title { font-size: 17px; margin: 2px 0 0; font-weight: 700; }
  .card-total { margin-left: auto; text-align: right; }
  .card-total-num { font-size: 20px; font-weight: 700; color: var(--amber-deep); display: block; }
  .card-total-label { font-size: 10px; color: var(--slate); text-transform: uppercase; }
  .sold-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .sold-chip { display: flex; align-items: center; gap: 8px; background: #F4F2EC; border: 1px solid #E4E0D3;
               border-radius: 20px; padding: 4px 6px 4px 10px; font-size: 11.5px; }
  .sold-chip-size { font-weight: 700; color: var(--ink); }

  .sold-line { padding: 10px 0; border-bottom: 1px solid #F0EDE3; }
  .sold-line:last-child { border-bottom: none; }
  .sold-line-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .sold-line-meta { display: flex; flex-direction: column; gap: 1px; }
  .sold-line-time { font-size: 10px; color: var(--slate); }
  .sold-line-price { flex-direction: row; align-items: center; gap: 8px; }
  .sold-line-price span:first-child { min-width: 62px; }

  .sold-total-banner { display: flex; flex-direction: column; align-items: center; background: #F4F2EC;
                        border-radius: 10px; padding: 16px; margin-bottom: 18px; }
  .sold-total-num { font-size: 26px; font-weight: 700; color: var(--amber-deep); }
  .sold-total-label { font-size: 11px; color: var(--slate); text-transform: uppercase; margin-top: 2px; }
  .sold-block { margin-bottom: 16px; }
  .sold-block-title { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }

  .copy-preview { margin: 4px 0 6px; }
  .copy-preview-label { font-size: 12px; color: var(--slate); margin-bottom: 8px; font-weight: 600; }

  .price-row { display: flex; align-items: center; justify-content: space-between; gap: 10px;
               padding: 8px 0; border-bottom: 1px solid #F0EDE3; }
  .price-row:last-child { border-bottom: none; }
  .price-row-size { font-weight: 700; font-size: 13px; min-width: 44px; }
  .price-row-fields { display: flex; gap: 8px; }
  .price-field { display: flex; flex-direction: column; gap: 2px; font-size: 10px; color: var(--slate); font-weight: 600; }
  .price-input { width: 72px; border: 1px solid #DAD6C9; border-radius: 6px; padding: 6px 8px; font-size: 13px; outline: none; }
  .price-input:focus { border-color: var(--amber-deep); }

  .banner-negative .sold-total-num { color: var(--red); }
  .profit-row { padding: 10px 0; border-bottom: 1px solid #F0EDE3; }
  .profit-row:last-child { border-bottom: none; }
  .profit-row-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
  .profit-row-name { font-size: 13.5px; font-weight: 600; }
  .profit-row-qty { font-size: 11px; color: var(--slate); }
  .profit-row-bottom { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: var(--slate); }
  .profit-row-pl { font-weight: 700; font-size: 13px; }
  .pl-positive { color: var(--green); }
  .pl-negative { color: var(--red); }
  .profit-row-missing { color: var(--amber-deep); font-style: italic; }

  .activity-day { margin-bottom: 18px; }
  .activity-day-header { display: flex; justify-content: space-between; align-items: baseline;
                          margin-bottom: 8px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
  .activity-day-label { font-size: 14px; font-weight: 800; color: var(--ink); }
  .activity-day-summary { font-size: 11px; color: var(--slate); }
  .activity-list { margin-bottom: 6px; }
  .activity-entry { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 12.5px; }
  .activity-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; white-space: nowrap; }
  .activity-badge-added { background: #EAF2EC; color: var(--green); }
  .activity-badge-sold { background: #FCEEDC; color: var(--amber-deep); }
  .activity-entry-text { flex: 1; color: var(--ink); }
  .activity-entry-qty { font-weight: 700; color: var(--slate); font-size: 12px; }
  .activity-qty-input { width: 48px; text-align: center; border: 1px solid #DAD6C9; border-radius: 6px;
                         padding: 4px 6px; font-size: 12.5px; font-weight: 700; color: var(--ink); outline: none; }
  .activity-qty-input:focus { border-color: var(--amber-deep); }

  .trash-row { display: flex; align-items: center; justify-content: space-between; gap: 10px;
               padding: 12px 0; border-bottom: 1px solid #F0EDE3; }
  .trash-row:last-child { border-bottom: none; }
  .trash-row-name { font-size: 14px; font-weight: 700; color: var(--ink); }
  .trash-row-meta { font-size: 11px; color: var(--slate); margin-top: 2px; }
  .trash-row-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

  .export-row { display: flex; align-items: center; justify-content: space-between; gap: 10px;
                padding: 12px 0; border-bottom: 1px solid #F0EDE3; }
  .export-row:last-of-type { border-bottom: none; }
  .export-row-label { font-size: 14px; font-weight: 700; color: var(--ink); }
  .export-row-desc { font-size: 11px; color: var(--slate); margin-top: 2px; }

  .account-info { background: #F4F2EC; border-radius: 10px; padding: 14px; margin-bottom: 16px; text-align: center; }
  .account-email-label { font-size: 10px; color: var(--slate); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
  .account-email { font-size: 15px; font-weight: 700; color: var(--ink); word-break: break-all; }

  .loc-row { display: grid; grid-template-columns: 90px 1fr 32px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .loc-row input { border: 1px solid #DAD6C9; border-radius: 6px; padding: 9px; font-size: 14px; outline: none; }
  .loc-row input:first-child { font-weight: 700; text-transform: uppercase; }
  .loc-add-form { background: #FAF9F5; border: 1px solid #EEEAE0; border-radius: 8px; padding: 12px; margin: 6px 0 4px; }
  .loc-add-form .field { margin-bottom: 10px; }

  .size-group { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
  .size-badge { min-width: 36px; height: 36px; background: var(--ink); color: var(--paper); border-radius: 8px;
                display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0; }
  .bintag-row { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
  .bintag-wrap { display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .bintag { position: relative; background: repeating-linear-gradient(135deg,#FFF7E8,#FFF7E8 6px,#FCEFD4 6px,#FCEFD4 12px);
            border: 1.5px solid var(--amber-deep); border-radius: 6px; padding: 6px 10px 6px 14px; min-width: 80px; text-align: center; }
  .bintag-notch { position: absolute; left: -5px; top: 50%; transform: translateY(-50%); width: 9px; height: 9px;
                  background: var(--paper); border: 1.5px solid var(--amber-deep); border-radius: 50%; }
  .bintag-code { font-weight: 700; font-size: 12.5px; }
  .bintag-label { font-size: 9.5px; color: var(--slate); }
  .bintag-meta { display: flex; align-items: center; gap: 4px; }

  .pill { font-size: 10.5px; font-weight: 600; padding: 3px 7px; border-radius: 20px; background: #EAF2EC; color: var(--green); }
  .pill-low { background: #FCEEDC; color: var(--amber-deep); }
  .pill-out { background: #F8E4E0; color: var(--red); }

  .qty-stepper { display: inline-flex; align-items: center; gap: 2px; background: #EAF2EC; border-radius: 20px; padding: 2px; }
  .qty-stepper.qty-low { background: #FCEEDC; }
  .qty-stepper.qty-out { background: #F8E4E0; }
  .stepper-btn { width: 22px; height: 22px; border-radius: 50%; background: #fff; font-weight: 700; font-size: 14px;
                 display: flex; align-items: center; justify-content: center; padding: 0; color: var(--ink); line-height: 1; }
  .stepper-btn:disabled { opacity: .35; }
  .stepper-input { width: 34px; text-align: center; border: none; background: transparent; font-size: 12px; font-weight: 700;
                    color: inherit; outline: none; -moz-appearance: textfield; padding: 0; }
  .stepper-input::-webkit-outer-spin-button, .stepper-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .icon-btn { background: transparent; border: none; cursor: pointer; color: var(--slate);
              display: inline-flex; align-items: center; justify-content: center; padding: 6px; border-radius: 6px; font-size: 15px; }
  .icon-btn.tiny { padding: 2px; font-size: 12px; }
  .icon-btn:disabled { opacity: .3; }

  .empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 60px 20px; gap: 10px; color: var(--slate); }
  .empty-state h2 { color: var(--ink); margin: 6px 0 0; font-size: 18px; }
  .empty-state p { max-width: 320px; font-size: 13.5px; line-height: 1.5; margin: 0 0 8px; }
  .empty-inline { text-align: center; padding: 40px 0; color: var(--slate); font-size: 13.5px; }

  .save-indicator { position: fixed; bottom: 12px; right: 14px; font-size: 10.5px;
                     color: var(--slate); background: #fff; border: 1px solid #E4E0D3; padding: 4px 9px; border-radius: 20px; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(27,36,48,.55); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal { background: #fff; border-radius: 16px 16px 0 0; width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid #EEEAE0; position: sticky; top: 0; background: #fff; }
  .modal-head h3 { margin: 0; font-size: 16px; }
  .modal-body { padding: 16px 18px 22px; }

  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; font-size: 12px; color: var(--slate); font-weight: 600; }
  .field input, .field select { border: 1px solid #DAD6C9; border-radius: 8px; padding: 11px; font-size: 16px; color: var(--ink); outline: none; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; padding: 10px; background: #FAF9F5; border-radius: 8px; border: 1px solid #EEEAE0; }
  .row input, .row select { border: 1px solid #DAD6C9; border-radius: 6px; padding: 9px; font-size: 15px; outline: none; }
  .row select:nth-of-type(2) { grid-column: 1 / -1; }
  .row.row-with-custom input[placeholder="Custom size"] { grid-column: 1 / -1; }
  .row-bottom { display: flex; gap: 8px; grid-column: 1 / -1; align-items: center; justify-content: flex-end; }

  .modal-actions { display: flex; flex-direction: column-reverse; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid #EEEAE0; }
  .modal-actions .btn { width: 100%; justify-content: center; }

  .lock-screen { max-width: 320px; margin: 15vh auto 0; padding: 24px; text-align: center; }
  .lock-screen h2 { margin: 0 0 6px; font-size: 19px; }
  .lock-sub { font-size: 13px; color: var(--slate); line-height: 1.5; margin: 0 0 18px; }
  .lock-input { width: 100%; text-align: center; font-size: 26px; letter-spacing: 10px; padding: 14px;
                border: 1px solid #DAD6C9; border-radius: 10px; margin-bottom: 14px; outline: none; }
  .lock-input:focus { border-color: var(--amber-deep); }
  .lock-error { color: var(--red); font-size: 12.5px; margin: -6px 0 12px; }
</style>
</head>
<body>

<div id="app"></div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // Supabase config
  // ---------------------------------------------------------------------
  var SUPABASE_URL = "https://ywmvcmogvkimwhmngtzh.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3bXZjbW9ndmtpbXdobW5ndHpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MjA3OTcsImV4cCI6MjEwMTk5Njc5N30.3h1Dh4ya0mDKhfcGEuM1rj-y63LCl8evBdMsEPdfBBU";

  var AUTH_SESSION_KEY = "stockmap_auth_session_v1";

  function getAuthSession() {
    try {
      var raw = localStorage.getItem(AUTH_SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function setAuthSession(session) {
    try {
      if (session) localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify(session));
      else localStorage.removeItem(AUTH_SESSION_KEY);
    } catch (e) {}
  }
  function getAuthToken() {
    var s = getAuthSession();
    return s && s.access_token ? s.access_token : null;
  }
  function getAuthEmail() {
    var s = getAuthSession();
    return s && s.user && s.user.email ? s.user.email : "";
  }

  var syncStatus = "idle"; // idle | syncing | error | offline
  var syncErrorMsg = "";

  function sbHeaders(extra) {
    var token = getAuthToken() || SUPABASE_ANON_KEY;
    var h = {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + token,
      "Content-Type": "application/json"
    };
    if (extra) for (var k in extra) h[k] = extra[k];
    return h;
  }

  // Generic REST call to a Supabase table.
  // method: GET/POST/PATCH/DELETE, path e.g. "items?select=*" or "items?id=eq.123"
  function sbRequest(table, method, query, body, extraHeaders) {
    var url = SUPABASE_URL + "/rest/v1/" + table + (query ? "?" + query : "");
    return fetch(url, {
      method: method,
      headers: sbHeaders(extraHeaders),
      body: body !== undefined ? JSON.stringify(body) : undefined
    }).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (t) {
          throw new Error("Supabase " + method + " " + table + " failed (" + res.status + "): " + t);
        });
      }
      var ct = res.headers.get("content-type") || "";
      if (ct.indexOf("application/json") !== -1) return res.json();
      return null;
    });
  }

  // ---------------------------------------------------------------------
  // Auth: magic link sign-in via Supabase Auth
  // ---------------------------------------------------------------------
  function sendMagicLink(email) {
    return fetch(SUPABASE_URL + "/auth/v1/otp", {
      method: "POST",
      headers: { "apikey": SUPABASE_ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, create_user: true })
    }).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (t) { throw new Error("Couldn't send link: " + t); });
      }
      return true;
    });
  }

  // Supabase redirects back with #access_token=...&refresh_token=...&... in the URL hash
  // after the person taps the magic link in their email.
  function checkAuthCallback() {
    var hash = window.location.hash;
    if (!hash || hash.indexOf("access_token") === -1) return false;
    var params = new URLSearchParams(hash.slice(1));
    var accessToken = params.get("access_token");
    var refreshToken = params.get("refresh_token");
    if (!accessToken) return false;

    // Fetch the user's profile to store their email alongside the session.
    fetch(SUPABASE_URL + "/auth/v1/user", {
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + accessToken }
    }).then(function (res) { return res.json(); })
      .then(function (user) {
        setAuthSession({ access_token: accessToken, refresh_token: refreshToken, user: user });
        history.replaceState(null, "", window.location.pathname + window.location.search);
        location.reload();
      })
      .catch(function () {
        setAuthSession({ access_token: accessToken, refresh_token: refreshToken, user: null });
        history.replaceState(null, "", window.location.pathname + window.location.search);
        location.reload();
      });
    return true;
  }

  function signOut() {
    setAuthSession(null);
    sessionStorage.removeItem("stockmap_unlocked");
    location.reload();
  }

  var STORAGE_KEY = "stockmap_db_v1";
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  var SIZE_PRESETS = [];
  for (var _s = 0; _s < 15; _s++) { SIZE_PRESETS.push(_s + "-" + (_s + 1)); }

  var PIN_KEY = "stockmap_pin_v1";
  var unlocked = sessionStorage.getItem("stockmap_unlocked") === "1";

  function getSavedPin() {
    try { return localStorage.getItem(PIN_KEY) || ""; } catch (e) { return ""; }
  }
  function setSavedPin(pin) {
    try { localStorage.setItem(PIN_KEY, pin); } catch (e) {}
  }

  function renderLogin() {
    var root = document.getElementById("app");
    root.innerHTML = "";
    var email = "";
    var sent = false;
    var sending = false;
    var errorMsg = "";

    function body() {
      var wrap = el("div", { class: "lock-screen" }, [
        el("div", { class: "brand-mark", style: "margin:0 auto 16px;width:48px;height:48px;font-size:20px;" }, ["S"]),
        el("h2", {}, [sent ? "Check your email" : "Sign in"]),
        el("p", { class: "lock-sub" }, [
          sent
            ? "We sent a sign-in link to " + email + ". Open it on this device to continue."
            : "Enter your email — we'll send you a link to sign in, no password needed."
        ])
      ]);

      if (!sent) {
        var emailInput = el("input", {
          class: "lock-input",
          style: "font-size:16px;letter-spacing:normal;text-align:left;",
          type: "email", placeholder: "you@example.com",
          value: email,
          onInput: function (e) { email = e.target.value; }
        });
        var sendBtn = el("button", {
          class: "btn btn-primary btn-full",
          onClick: function () {
            if (!email.trim() || sending) return;
            sending = true;
            errorMsg = "";
            renderInner();
            sendMagicLink(email.trim()).then(function () {
              sending = false;
              sent = true;
              renderInner();
            }).catch(function (err) {
              sending = false;
              errorMsg = "Couldn't send the link. Check the email and try again.";
              renderInner();
            });
          }
        }, [sending ? "Sending…" : "Send sign-in link"]);

        wrap.appendChild(emailInput);
        if (errorMsg) wrap.appendChild(el("p", { class: "lock-error" }, [errorMsg]));
        wrap.appendChild(sendBtn);
      } else {
        wrap.appendChild(el("button", {

  function loadDB() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (!parsed.sold) parsed.sold = [];
        parsed.sold.forEach(function (s) { if (s.sellPrice === undefined) s.sellPrice = ""; if (!s.ts) s.ts = 0; });
        if (!parsed.items) parsed.items = [];
        if (!parsed.locations) parsed.locations = [];
        if (!parsed.stock) parsed.stock = [];
        if (!parsed.prices) parsed.prices = [];
        (function migratePrices() {
          var hasOldShape = parsed.prices.some(function (p) { return p.size !== undefined; });
          if (!hasOldShape) return;
          var collapsed = {};
          parsed.prices.forEach(function (p) {
            if (!collapsed[p.itemId] || (collapsed[p.itemId].cost === "" && p.cost !== "")) {
              collapsed[p.itemId] = { id: p.id, itemId: p.itemId, cost: p.cost };
            }
          });
          parsed.prices = Object.keys(collapsed).map(function (k) { return collapsed[k]; });
        })();
        if (!parsed.activity) parsed.activity = [];
        if (!parsed.trash) parsed.trash = [];
        return parsed;
      }
    } catch (e) {}
    return { items: [], locations: [], stock: [], sold: [], prices: [], activity: [], trash: [] };
  }
  function saveDB(db) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) {}
    queueSync();
  }

  // ---------------------------------------------------------------------
  // Sync engine: local-first. Every saveDB() schedules a debounced push
  // of the full current state to Supabase. A pull happens on load and
  // periodically, merging remote data in (remote wins on conflict, since
  // this is a small-team tool and simplicity beats perfect CRDT merging).
  // ---------------------------------------------------------------------
  var syncTimer = null;
  var syncInFlight = false;
  var syncQueued = false;

  function queueSync() {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(pushToSupabase, 900);
  }

  function setSyncStatus(status, msg) {
    syncStatus = status;
    syncErrorMsg = msg || "";
    updateSyncIndicator();
  }

  function updateSyncIndicator() {
    var el2 = document.getElementById("sync-indicator");
    if (!el2) return;
    var label = syncStatus === "syncing" ? "Syncing…"
      : syncStatus === "error" ? "Sync error — tap to retry"
      : syncStatus === "offline" ? "Offline — saved locally"
      : "Synced";
    el2.textContent = label;
    el2.className = "sync-indicator sync-" + syncStatus;
  }

  function tableRows(db) {
    return {
      locations: db.locations.map(function (l) { return { id: l.id, code: l.code, label: l.label || "" }; }),
      items: db.items.map(function (i) { return { id: i.id, sku: i.sku || "", name: i.name, category: i.category || "", created_at: i.createdAt || 0 }; }),
      stock: db.stock.map(function (s) { return { id: s.id, item_id: s.itemId, location_id: s.locationId, size: s.size, qty: s.qty }; }),
      sold: db.sold.map(function (s) { return { id: s.id, item_id: s.itemId, size: s.size, qty: s.qty, sell_price: s.sellPrice === "" ? null : s.sellPrice, ts: s.ts || 0 }; }),
      prices: db.prices.map(function (p) { return { id: p.id, item_id: p.itemId, cost: p.cost === "" ? null : p.cost }; }),
      activity: db.activity.map(function (a) { return { id: a.id, type: a.type, item_id: a.itemId, item_name: a.itemName, size: a.size, qty: a.qty, ts: a.ts }; }),
      trash: db.trash.map(function (t) { return { id: t.id, deleted_at: t.deletedAt, item: t.item, stock: t.stock }; })
    };
  }

  function pushToSupabase() {
    if (syncInFlight) { syncQueued = true; return; }
    syncInFlight = true;
    setSyncStatus("syncing");

    var tables = tableRows(db);
    var order = ["locations", "items", "stock", "sold", "prices", "activity", "trash"];

    var chain = Promise.resolve();
    order.forEach(function (table) {
      chain = chain.then(function () {
        var rows = tables[table];
        if (rows.length === 0) return Promise.resolve();
        return sbRequest(table, "POST", "on_conflict=id", rows, { "Prefer": "resolution=merge-duplicates" });
      });
    });

    chain.then(function () {
      syncInFlight = false;
      setSyncStatus("idle");
      if (syncQueued) { syncQueued = false; queueSync(); }
    }).catch(function (err) {
      syncInFlight = false;
      console.error(err);
      setSyncStatus("error", err.message);
    });
  }

  function fromRemoteRow_item(r) { return { id: r.id, sku: r.sku || "", name: r.name, category: r.category || "", createdAt: r.created_at || 0 }; }
  function fromRemoteRow_location(r) { return { id: r.id, code: r.code, label: r.label || "" }; }
  function fromRemoteRow_stock(r) { return { id: r.id, itemId: r.item_id, locationId: r.location_id, size: r.size, qty: r.qty }; }
  function fromRemoteRow_sold(r) { return { id: r.id, itemId: r.item_id, size: r.size, qty: r.qty, sellPrice: r.sell_price === null ? "" : r.sell_price, ts: r.ts || 0 }; }
  function fromRemoteRow_price(r) { return { id: r.id, itemId: r.item_id, cost: r.cost === null ? "" : r.cost }; }
  function fromRemoteRow_activity(r) { return { id: r.id, type: r.type, itemId: r.item_id, itemName: r.item_name, size: r.size, qty: r.qty, ts: r.ts }; }
  function fromRemoteRow_trash(r) { return { id: r.id, deletedAt: r.deleted_at, item: r.item, stock: r.stock }; }

  function pullFromSupabase() {
    return Promise.all([
      sbRequest("locations", "GET", "select=*"),
      sbRequest("items", "GET", "select=*"),
      sbRequest("stock", "GET", "select=*"),
      sbRequest("sold", "GET", "select=*"),
      sbRequest("prices", "GET", "select=*"),
      sbRequest("activity", "GET", "select=*"),
      sbRequest("trash", "GET", "select=*")
    ]).then(function (results) {
      var next = {
        locations: results[0].map(fromRemoteRow_location),
        items: results[1].map(fromRemoteRow_item),
        stock: results[2].map(fromRemoteRow_stock),
        sold: results[3].map(fromRemoteRow_sold),
        prices: results[4].map(fromRemoteRow_price),
        activity: results[5].map(fromRemoteRow_activity),
        trash: results[6].map(fromRemoteRow_trash)
      };
      db = next;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) {}
      setSyncStatus("idle");
      render();
    });
  }

  var MIGRATION_DONE_KEY = "stockmap_migrated_v1";

  function hasAnyLocalData(d) {
    return d.items.length > 0 || d.locations.length > 0 || d.stock.length > 0 ||
           d.sold.length > 0 || d.prices.length > 0 || d.activity.length > 0 || d.trash.length > 0;
  }

  function initialSync() {
    var alreadyMigrated = localStorage.getItem(MIGRATION_DONE_KEY) === "1";

    if (!alreadyMigrated && hasAnyLocalData(db)) {
      // First time syncing this device, and there's existing phone data.
      // Check if Supabase already has data (e.g. another device set this up first).
      // If Supabase is empty, this phone's data is the "source of truth" — push it up
      // instead of pulling empty tables and wiping it.
      setSyncStatus("syncing");
      sbRequest("items", "GET", "select=id&limit=1").then(function (remoteItems) {
        if (remoteItems.length === 0) {
          // Supabase is empty — push local data up to seed it.
          pushToSupabase();
          localStorage.setItem(MIGRATION_DONE_KEY, "1");
          setSyncStatus("idle");
        } else {
          // Supabase already has data from elsewhere — pull it in as normal.
          localStorage.setItem(MIGRATION_DONE_KEY, "1");
          pullFromSupabase().catch(function (err) {
            console.error(err);
            setSyncStatus(navigator.onLine ? "error" : "offline", err.message);
            render();
          });
        }
      }).catch(function (err) {
        console.error(err);
        setSyncStatus(navigator.onLine ? "error" : "offline", err.message);
      });
      return;
    }

    localStorage.setItem(MIGRATION_DONE_KEY, "1");
    setSyncStatus("syncing");
    pullFromSupabase().catch(function (err) {
      console.error(err);
      // If pull fails (e.g. offline on first load), fall back to local data silently.
      setSyncStatus(navigator.onLine ? "error" : "offline", err.message);
      render();
    });
  }

  var db = loadDB();
  var ui = { query: "", locationFilter: "", modal: null };

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    for (var key in attrs) {
      if (key === "class") node.className = attrs[key];
      else if (key === "html") node.innerHTML = attrs[key];
      else if (key.indexOf("on") === 0 && typeof attrs[key] === "function") {
        node.addEventListener(key.slice(2).toLowerCase(), attrs[key]);
      } else if (key === "value") node.value = attrs[key];
      else node.setAttribute(key, attrs[key]);
    }
    (children || []).forEach(function (c) {
      if (c === null || c === undefined) return;
      if (typeof c === "string") node.appendChild(document.createTextNode(c));
      else node.appendChild(c);
    });
    return node;
  }

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function render() {
    var root = document.getElementById("app");
    root.innerHTML = "";
    root.appendChild(buildApp());
    if (ui.modal) root.appendChild(ui.modal());
  }

  function totalUnits() { return db.stock.reduce(function (s, r) { return s + r.qty; }, 0); }
  function lowCount() { return db.stock.filter(function (r) { return r.qty <= 3; }).length; }
  function locationsById() {
    var map = {};
    db.locations.forEach(function (l) { map[l.id] = l; });
    return map;
  }

  function filteredItems() {
    var q = ui.query.trim().toLowerCase();
    return db.items.filter(function (it) {
      var matchesQuery = !q ||
        it.name.toLowerCase().indexOf(q) !== -1 ||
        (it.sku || "").toLowerCase().indexOf(q) !== -1 ||
        (it.category || "").toLowerCase().indexOf(q) !== -1;
      var rows = db.stock.filter(function (s) { return s.itemId === it.id; });
      var matchesLoc = !ui.locationFilter || rows.some(function (r) { return r.locationId === ui.locationFilter; });
      return matchesQuery && matchesLoc;
    });
  }

  function buildApp() {
    var shell = el("div", {}, [
      buildTopbar(),
      buildStats(),
      buildFilters(),
      buildContent(),
      el("div", { class: "save-indicator" }, ["Saved on this device"])

          }, [

        el("button", { class: "btn btn-ghost", onClick: function () { ui.modal = priceModal(); render(); } }, ["💲"]),
        el("button", { class: "btn btn-ghost", onClick: function () { ui.modal = profitModal(); render(); } }, ["📊"]),
        el("button", { class: "btn btn-ghost", onClick: function () { ui.modal = activityModal(); render(); } }, ["📅"]),
        el("button", { class: "btn btn-ghost", onClick: function () { ui.modal = exportModal(); render(); } }, ["⬇️"]),
        el("button", { class: "btn btn-ghost", onClick: function () { ui.modal = trashModal(); render(); } }, ["🗑️"]),
        el("button", { class: "btn btn-primary", onClick: function () { ui.modal = addItemModal(); render(); } }, ["+ Add"])

  function buildStats() {
    function stat(num, label, warn) {
      return el("div", { class: "stat" + (warn ? " stat-warn" : "") }, [

      ]);

  function buildFilters() {
    var searchInput = el("input", {
      placeholder: "Search product, SKU, category…",

      onInput: function (e) { ui.query = e.target.value; renderContentOnly(); }
    });

    }, [el("option", { value: "" }, ["All locations"])].concat(

      })
    ));
    return el("div", { class: "filters", id: "filters" }, [
      el("div", { class: "search-box" }, [el("span", {}, ["🔍"]), searchInput]),
      select
    ]);

  function renderContentOnly() {
    var old = document.getElementById("content-area");
    if (old) old.replaceWith(buildContent());
  }

  function buildContent() {
    var wrap = el("main", { class: "content", id: "content-area" });
    if (db.items.length === 0) {
      wrap.appendChild(emptyState());
      return wrap;
    }
    var items = filteredItems();
    if (items.length === 0) {
      wrap.appendChild(el("div", { class: "empty-inline" }, ["No products match your search."]));
      return wrap;
    }
    var locMap = locationsById();
    items.forEach(function (item) {
      var rows = db.stock.filter(function (s) { return s.itemId === item.id; });
      wrap.appendChild(itemCard(item, rows, locMap));
    });
    return wrap;
  }

  function emptyState() {
    return el("div", { class: "empty-state" }, [
      el("div", {}, ["📦"]),
      el("h2", {}, ["No products yet"]),
      el("p", {}, ["Add your first product, give it sizes, and pin exactly which shelf, rack, or bin each size lives in."]),
      el("button", { class: "btn btn-primary", onClick: function () { ui.modal = addItemModal(); render(); } }, ["+ Add your first product"])
    ]);
  }

  function stockPill(qty) {
    var cls = "pill";
    var prefix = "";
    if (qty === 0) { cls += " pill-out"; prefix = "⚠ "; }
    else if (qty <= 3) { cls += " pill-low"; }
    return el("span", { class: cls }, [prefix + qty + " " + (qty === 1 ? "unit" : "units")]);
  }

  function logActivity(type, itemId, itemName, size, qty) {
    db.activity.push({
      id: uid(),
      type: type, // "added" or "sold"
      itemId: itemId,
      itemName: itemName,
      size: size,
      qty: qty,
      ts: Date.now()
    });
  }

  function moveToTrash(item) {
    var itemStock = db.stock.filter(function (s) { return s.itemId === item.id; });
    db.trash.push({
      id: uid(),
      deletedAt: Date.now(),
      item: item,
      stock: itemStock
    });
    db.items = db.items.filter(function (i) { return i.id !== item.id; });
    db.stock = db.stock.filter(function (s) { return s.itemId !== item.id; });
  }

  function restoreFromTrash(trashEntry) {
    db.items.push(trashEntry.item);
    trashEntry.stock.forEach(function (s) { db.stock.push(s); });
    db.trash = db.trash.filter(function (t) { return t.id !== trashEntry.id; });
  }

  function recordSale(row, amount) {
    if (amount <= 0) return;
    db.sold.push({ id: uid(), itemId: row.itemId, size: row.size, qty: amount, sellPrice: "", ts: Date.now() });
    var itemForLog = db.items.find(function (i) { return i.id === row.itemId; });
    logActivity("sold", row.itemId, itemForLog ? itemForLog.name : "Unknown", row.size, amount);
  }

  function updateQty(row, newQty) {
    newQty = Math.max(0, Math.floor(Number(newQty) || 0));
    var diff = row.qty - newQty;
    if (diff > 0) {
      recordSale(row, diff);
    } else if (diff < 0) {
      var restockAmount = -diff;
      var itemForLog = db.items.find(function (i) { return i.id === row.itemId; });
      logActivity("added", row.itemId, itemForLog ? itemForLog.name : "Unknown", row.size, restockAmount);
    }
    row.qty = newQty;
    saveDB(db);
    render();
  }

  function qtyStepper(row) {
    var minusBtn = el("button", {
      class: "icon-btn tiny stepper-btn",
      onClick: function () { updateQty(row, row.qty - 1); }
    }, ["−"]);
    if (row.qty <= 0) minusBtn.disabled = true;

    var qtyInput = el("input", {
      class: "stepper-input",
      type: "number", min: "0", value: row.qty,
      onInput: function (e) {
        row.qty = Math.max(0, Math.floor(Number(e.target.value) || 0));
      },
      onBlur: function (e) { updateQty(row, e.target.value); },
      onClick: function (e) { e.stopPropagation(); }
    });

    var plusBtn = el("button", {
      class: "icon-btn tiny stepper-btn",
      onClick: function () { updateQty(row, row.qty + 1); }
    }, ["+"]);

    var wrap = el("div", { class: "qty-stepper" + (row.qty === 0 ? " qty-out" : row.qty <= 3 ? " qty-low" : "") }, [
      minusBtn, qtyInput, plusBtn
    ]);
    return wrap;
  }

  function updateSold(soldEntry, newQty) {
    newQty = Math.max(0, Math.floor(Number(newQty) || 0));
    soldEntry.qty = newQty;
    saveDB(db);
    if (ui.modal) {
      ui.modal = soldModal();
    }
    render();
  }

  function soldStepper(soldEntry) {
    var minusBtn = el("button", {
      class: "icon-btn tiny stepper-btn",
      onClick: function () { updateSold(soldEntry, soldEntry.qty - 1); }
    }, ["−"]);
    if (soldEntry.qty <= 0) minusBtn.disabled = true;

    var qtyInput = el("input", {
      class: "stepper-input",
      type: "number", min: "0", value: soldEntry.qty,
      onInput: function (e) { soldEntry.qty = Math.max(0, Math.floor(Number(e.target.value) || 0)); },
      onBlur: function (e) { updateSold(soldEntry, e.target.value); },
      onClick: function (e) { e.stopPropagation(); }
    });

    var plusBtn = el("button", {
      class: "icon-btn tiny stepper-btn",
      onClick: function () { updateSold(soldEntry, soldEntry.qty + 1); }
    }, ["+"]);

    return el("div", { class: "qty-stepper" }, [minusBtn, qtyInput, plusBtn]);

  function itemCard(item, rows, locMap) {
    var card = el("div", { class: "card" }, [
      el("div", { class: "card-actions-top" }, [
        el("button", {
          class: "icon-btn",
          onClick: function () { ui.modal = editItemModal(item); render(); }
        }, ["✏️"]),
        el("button", {
          class: "icon-btn",
          onClick: function () { ui.modal = copyItemModal(item); render(); }
        }, ["📋"]),
        el("button", {
          class: "icon-btn",
          onClick: function () {
            confirmWithPin("Enter your PIN to delete \"" + item.name + "\". It'll be moved to Recently Deleted and can be restored later.", function () {
              moveToTrash(item);
              saveDB(db);
              closeModal();
            });
          }
        }, ["🗑"])
      ]),
      el("div", { class: "card-head" }, [
        el("div", {}, [
          el("div", { class: "card-eyebrow" }, [(item.sku || "NO-SKU") + (item.category ? " · " + item.category : "")]),
          el("h3", { class: "card-title" }, [item.name])
        ]),
        el("div", { class: "card-total" }, [
          el("span", { class: "card-total-num" }, [String(rows.reduce(function (s, r) { return s + r.qty; }, 0))]),
          el("span", { class: "card-total-label" }, ["total units"])
        ])
      ])
    ]);

    var byLocation = {};
    rows.forEach(function (r) {
      if (!byLocation[r.locationId]) byLocation[r.locationId] = [];
      byLocation[r.locationId].push(r);
    });
    var locKeys = Object.keys(byLocation).sort(function (a, b) {
      var la = locMap[a], lb = locMap[b];
      var ca = la ? la.code : "";
      var cb = lb ? lb.code : "";
      return ca < cb ? -1 : ca > cb ? 1 : 0;
    });

    locKeys.forEach(function (locId) {
      var loc = locMap[locId];
      var sizeRow = el("div", { class: "bintag-row" });
      byLocation[locId]
        .slice()

  function csvEscape(val) {
    if (val && typeof val === "object" && val.__csvRaw !== undefined) {
      return val.__csvRaw;
    }
    var s = val === null || val === undefined ? "" : String(val);
    if (/[",\n]/.test(s)) {
      s = '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  }

  // Forces Excel to treat a value as literal text instead of auto-converting
  // patterns like "3-4" or "0-1" into dates.
  function csvForceText(val) {
    var s = val === null || val === undefined ? "" : String(val);
    return { __csvRaw: '="' + s.replace(/"/g, '""') + '"' };
  }

  function rowsToCsv(headers, rows) {
    var lines = [headers.map(csvEscape).join(",")];
    rows.forEach(function (r) {
      lines.push(r.map(csvEscape).join(","));
    });
    return lines.join("\r\n");
  }

  function downloadCsv(filename, csvText) {
    var blob = new Blob([csvText], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function dateStamp() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function exportProductsCsv() {
    var locById = {};
    db.locations.forEach(function (l) { locById[l.id] = l; });
    var headers = ["Product Name", "SKU", "Category", "Size", "Location Code", "Location Label", "Quantity"];
    var rows = [];
    db.items.forEach(function (item) {
      var itemStock = db.stock.filter(function (s) { return s.itemId === item.id; });
      if (itemStock.length === 0) {
        rows.push([item.name, item.sku || "", item.category || "", "", "", "", ""]);
      } else {
        itemStock.forEach(function (s) {
          var loc = locById[s.locationId];
          rows.push([item.name, item.sku || "", item.category || "", csvForceText(s.size), loc ? loc.code : "", loc ? loc.label : "", s.qty]);
        });
      }
    });
    downloadCsv("stockmap-products-" + dateStamp() + ".csv", rowsToCsv(headers, rows));
  }

  function exportPricesCsv() {
    var headers = ["Product Name", "SKU", "Avg. Cost Price"];
    var rows = db.items.map(function (item) {
      var price = getPrice(item.id);
      return [item.name, item.sku || "", price && price.cost !== "" ? price.cost : ""];
    });
    downloadCsv("stockmap-prices-" + dateStamp() + ".csv", rowsToCsv(headers, rows));
  }

  function exportSoldCsv() {
    var itemById = {};
    db.items.forEach(function (i) { itemById[i.id] = i; });
    var headers = ["Product Name", "SKU", "Size", "Quantity Sold", "Sell Price", "Date"];
    var rows = db.sold.map(function (s) {
      var item = itemById[s.itemId];
      var dateStr = s.ts ? new Date(s.ts).toLocaleString() : "";
      return [item ? item.name : "Unknown", item ? item.sku || "" : "", csvForceText(s.size), s.qty, s.sellPrice !== "" ? s.sellPrice : "", dateStr];
    });
    downloadCsv("stockmap-sold-" + dateStamp() + ".csv", rowsToCsv(headers, rows));
  }

  function exportProfitCsv() {
    var itemById = {};
    db.items.forEach(function (i) { itemById[i.id] = i; });
    var headers = ["Product Name", "SKU", "Size", "Quantity Sold", "Cost Price", "Sell Price", "Profit/Loss"];
    var rows = [];
    db.sold.forEach(function (s) {
      if (s.qty <= 0) return;
      var item = itemById[s.itemId];
      if (!item) return;
      var price = getPrice(s.itemId);
      var cost = price && price.cost !== "" ? Number(price.cost) : null;
      var sell = s.sellPrice !== "" && s.sellPrice !== undefined ? Number(s.sellPrice) : null;
      var profit = (cost !== null && sell !== null) ? (sell - cost) * s.qty : "";
      rows.push([
        item.name, item.sku || "", csvForceText(s.size), s.qty,
        cost !== null ? cost : "",
        sell !== null ? sell : "",
        profit
      ]);
    });
    downloadCsv("stockmap-profit-loss-" + dateStamp() + ".csv", rowsToCsv(headers, rows));
  }

  function formatDateKey(ts) {
    var d = new Date(ts);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function formatDateLabel(dateKey) {
    var parts = dateKey.split("-").map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    var today = new Date();
    var todayKey = formatDateKey(today.getTime());
    var yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);
    var yesterdayKey = formatDateKey(yesterday.getTime());
    if (dateKey === todayKey) return "Today";
    if (dateKey === yesterdayKey) return "Yesterday";
    var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return months[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
  }

              saveDB(db);
              ui.modal = trashModal();
              render();
            }
          }, ["Restore"]);

          var deleteForeverBtn = el("button", {
            class: "icon-btn",
            onClick: function () {
              confirmWithPin("Enter your PIN to permanently delete \"" + t.item.name + "\". This cannot be undone.", function () {
                db.trash = db.trash.filter(function (x) { return x.id !== t.id; });
                saveDB(db);
                ui.modal = trashModal();
                render();
              });
            }
          }, ["🗑"]);

          wrap.appendChild(el("div", { class: "trash-row" }, [
            el("div", { class: "trash-row-info" }, [
              el("div", { class: "trash-row-name" }, [t.item.name + (t.item.sku ? " · " + t.item.sku : "")]),
              el("div", { class: "trash-row-meta" }, [sizesText + " · " + totalQty + " units · deleted " + when])
            ]),
            el("div", { class: "trash-row-actions" }, [restoreBtn, deleteForeverBtn])
          ]));
        });

      wrap.appendChild(el("div", { class: "modal-actions" }, [
        el("button", { class: "btn btn-primary", onClick: closeModal }, ["Close"])
      ]));

      return [wrap];
    }

    return modalShell("Recently Deleted", body());
  }

  function activityModal() {
    function body() {
      if (db.activity.length === 0) {
        return [
          el("div", { class: "empty-state", style: "padding:30px 10px;" }, [
            el("div", {}, ["📅"]),
            el("h2", {}, ["No activity yet"]),
            el("p", {}, ["Every product you add and every sale you record will show up here, grouped by date."])
          ]),
          el("div", { class: "modal-actions" }, [
            el("button", { class: "btn btn-primary", onClick: closeModal }, ["Close"])
          ])
        ];
      }

      var byDate = {};
      db.activity.forEach(function (a) {
        var key = formatDateKey(a.ts);
        if (!byDate[key]) byDate[key] = { added: [], sold: [] };
        byDate[key][a.type].push(a);
      });

      var dateKeys = Object.keys(byDate).sort().reverse();

      function activityQtyInput(entry) {
        return el("input", {
          class: "activity-qty-input",
          type: "number", min: "0",
          value: entry.qty,
          onInput: function (e) { entry.qty = e.target.value; },
          onBlur: function (e) {
            var v = Math.max(0, Math.floor(Number(e.target.value) || 0));
            entry.qty = v;
            saveDB(db);
            ui.modal = activityModal();
            render();
          },
          onClick: function (e) { e.stopPropagation(); }
        });
      }

      var wrap = el("div", {});
      dateKeys.forEach(function (dateKey) {
        var dayData = byDate[dateKey];
        var addedTotal = dayData.added.reduce(function (s, a) { return s + a.qty; }, 0);
        var soldTotal = dayData.sold.reduce(function (s, a) { return s + a.qty; }, 0);

        var dayBlock = el("div", { class: "activity-day" }, [
          el("div", { class: "activity-day-header" }, [
            el("span", { class: "activity-day-label" }, [formatDateLabel(dateKey)]),
            el("span", { class: "activity-day-summary" }, [
              [
                (addedTotal > 0 ? addedTotal + " added" : ""),
                (addedTotal > 0 && soldTotal > 0 ? " · " : ""),
                (soldTotal > 0 ? soldTotal + " sold" : "")
              ].join("")
            ])
          ])
        ]);

        if (dayData.added.length > 0) {
          var addedList = el("div", { class: "activity-list" });
          dayData.added.forEach(function (a) {
            addedList.appendChild(el("div", { class: "activity-entry" }, [
              el("span", { class: "activity-badge activity-badge-added" }, ["+ Added"]),
              el("span", { class: "activity-entry-text" }, [a.itemName + " — " + a.size]),
              activityQtyInput(a)
            ]));
          });
          dayBlock.appendChild(addedList);
        }

        if (dayData.sold.length > 0) {
          var soldList = el("div", { class: "activity-list" });
          dayData.sold.forEach(function (a) {
            soldList.appendChild(el("div", { class: "activity-entry" }, [
              el("span", { class: "activity-badge activity-badge-sold" }, ["− Sold"]),
              el("span", { class: "activity-entry-text" }, [a.itemName + " — " + a.size]),
              activityQtyInput(a)
            ]));
          });
          dayBlock.appendChild(soldList);
        }

        wrap.appendChild(dayBlock);
      });

      wrap.appendChild(el("div", { class: "modal-actions" }, [
        el("button", { class: "btn btn-primary", onClick: closeModal }, ["Close"]),
        el("button", {
          class: "btn btn-ghost btn-danger",
          onClick: function () {
            confirmWithPin(
              "This will permanently clear every logged added and sold entry. Enter your PIN to confirm.",
              function () {
                db.activity = [];
                saveDB(db);
                ui.modal = activityModal();
                render();
              }
            );
          }
        }, ["Reset all activity"])
      ]));

      return [wrap];
    }

    return modalShell("Activity", body());
  }

  function soldModal() {
    function body() {
      var itemsWithSales = db.items.filter(function (item) {
        return db.sold.some(function (s) { return s.itemId === item.id; });
      });

      if (itemsWithSales.length === 0) {
        return [
          el("div", { class: "empty-state", style: "padding:30px 10px;" }, [
            el("div", {}, ["🧾"]),
            el("h2", {}, ["No sales yet"]),
            el("p", {}, ["When you reduce stock quantity, it's logged here as sold. You'll be able to see and edit totals per product and size."])
          ]),
          el("div", { class: "modal-actions" }, [
            el("button", { class: "btn btn-primary", onClick: closeModal }, ["Close"])
          ])
        ];
      }

      var totalSold = db.sold.reduce(function (s, r) { return s + r.qty; }, 0);
      var wrap = el("div", {}, [
        el("div", { class: "sold-total-banner" }, [
          el("span", { class: "sold-total-num" }, [String(totalSold)]),
          el("span", { class: "sold-total-label" }, ["total units sold"])
        ])
      ]);

      itemsWithSales.forEach(function (item) {
        var entries = db.sold.filter(function (s) { return s.itemId === item.id; });
        var block = el("div", { class: "sold-block" }, [
          el("div", { class: "sold-block-title" }, [item.name + (item.sku ? " · " + item.sku : "")])
        ]);
        entries
          .slice()
          .sort(function (a, b) {
            if (a.size !== b.size) return a.size < b.size ? -1 : 1;
            return (a.ts || 0) - (b.ts || 0);
          })
          .forEach(function (s) {
            var sellInput = el("input", {
              class: "price-input",
              type: "number", min: "0", step: "0.01",
              placeholder: "Sell price",
              value: s.sellPrice,
              onInput: function (e) { s.sellPrice = e.target.value; },
              onBlur: function (e) {
                var v = e.target.value;
                s.sellPrice = v === "" ? "" : Math.max(0, Number(v) || 0);
                saveDB(db);
                e.target.value = s.sellPrice;
              }
            });
            var timeLabel = s.ts ? new Date(s.ts).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
            var deleteBtn = el("button", {
              class: "icon-btn tiny",
              onClick: function () {
                confirmWithPin("Enter your PIN to delete this sold entry.", function () {
                  db.sold = db.sold.filter(function (x) { return x.id !== s.id; });
                  saveDB(db);
                  ui.modal = soldModal();
                  render();
                });
              }
            }, ["✕"]);
            block.appendChild(el("div", { class: "sold-line" }, [
              el("div", { class: "sold-line-top" }, [
                el("div", { class: "sold-line-meta" }, [
                  el("span", { class: "sold-chip-size" }, [s.size]),
                  timeLabel ? el("span", { class: "sold-line-time" }, [timeLabel]) : null
                ]),
                soldStepper(s),
                deleteBtn
              ]),
              el("label", { class: "price-field sold-line-price" }, [
                el("span", {}, ["Sell price"]),
                sellInput
              ])
            ]));
          });
        wrap.appendChild(block);
      });

      wrap.appendChild(el("div", { class: "modal-actions" }, [
        el("button", { class: "btn btn-primary", onClick: closeModal }, ["Close"]),
        el("button", {
          class: "btn btn-ghost btn-danger",
          onClick: function () {
            confirmWithPin(
              "This will permanently clear every sold total for every product. Enter your PIN to confirm.",
              function () {
                db.sold = [];
                saveDB(db);
                ui.modal = soldModal();
                render();
              }
            );
          }
        }, ["Reset all sold data"])
      ]));

      return [wrap];
    }

    return modalShell("Sold", body());
  }

  function manageLocationsModal(initialAddingNew) {
    var addingNew = !!initialAddingNew;
    var newCode = "", newLabel = "";

    function body() {
      var listWrap = el("div", {});

      db.locations
        .slice()
        .sort(function (a, b) { return a.code < b.code ? -1 : a.code > b.code ? 1 : 0; })
        .forEach(function (loc) {
          var codeInput = el("input", {
            value: loc.code,
            onInput: function (e) { loc.code = e.target.value.toUpperCase(); e.target.value = loc.code; },
            onBlur: function () { if (loc.code.trim()) saveDB(db); }
          });
          var labelInput = el("input", {
            value: loc.label || "",
            placeholder: "Description (optional)",
            onInput: function (e) { loc.label = e.target.value; },
            onBlur: function () { saveDB(db); }
          });
          var deleteBtn = el("button", {
            class: "icon-btn",
            onClick: function () {
              var inUse = db.stock.some(function (s) { return s.locationId === loc.id; });
              var msg = inUse
                ? "This location has stock assigned to it. Enter your PIN to delete it anyway — stock entries here will be removed too."
                : "Enter your PIN to delete this location.";
              confirmWithPin(msg, function () {
                db.locations = db.locations.filter(function (l) { return l.id !== loc.id; });
                db.stock = db.stock.filter(function (s) { return s.locationId !== loc.id; });
                saveDB(db);
                ui.modal = manageLocationsModal();
                render();
              });
            }
          }, ["🗑"]);

          listWrap.appendChild(el("div", { class: "loc-row" }, [
            codeInput, labelInput, deleteBtn
          ]));
        });

      if (db.locations.length === 0) {
        listWrap.appendChild(el("p", { class: "lock-sub", style: "margin:0 0 14px;" }, ["No locations yet — add one below."]));
      }

      var children = [listWrap];

      if (addingNew) {
        var newCodeInput = el("input", {
          placeholder: "e.g. A1-03",
          value: newCode,
          onInput: function (e) { newCode = e.target.value.toUpperCase(); e.target.value = newCode; }
        });
        var newLabelInput = el("input", {
          placeholder: "e.g. Warehouse A, Rack 1, Shelf 3",
          value: newLabel,
          onInput: function (e) { newLabel = e.target.value; }
        });
        var confirmAddBtn = el("button", {
          class: "btn btn-primary btn-sm",
          onClick: function () {
            if (!newCode.trim()) return;
            db.locations.push({ id: uid(), code: newCode.trim(), label: newLabel.trim() });
            saveDB(db);
            ui.modal = manageLocationsModal();
            render();
          }
        }, ["Add"]);
        children.push(el("div", { class: "loc-add-form" }, [
          el("label", { class: "field" }, [el("span", {}, ["New location code"]), newCodeInput]),
          el("label", { class: "field" }, [el("span", {}, ["Description (optional)"]), newLabelInput]),
          confirmAddBtn
        ]));
      } else {
        children.push(el("button", {
          class: "btn btn-ghost btn-sm",
          onClick: function () {
            ui.modal = manageLocationsModal(true);
            render();
          }
        }, ["+ Add new location"]));
      }

      children.push(el("div", { class: "modal-actions" }, [
        el("button", { class: "btn btn-primary", onClick: closeModal }, ["Done"])
      ]));

      return children;
    }

    return modalShell("Manage locations", body());
  }

  function addLocationModal(onCreated) {
    var codeVal = "", labelVal = "";
    function body() {
      var codeInput = el("input", {
        placeholder: "e.g. A1-03",
        value: codeVal,
        onInput: function (e) { codeVal = e.target.value.toUpperCase(); e.target.value = codeVal; }
      });
      var labelInput = el("input", {
        placeholder: "e.g. Warehouse A, Rack 1, Shelf 3",
        value: labelVal,
        onInput: function (e) { labelVal = e.target.value; }
      });
      var saveBtn = el("button", {
        class: "btn btn-primary",
        onClick: function () {
          if (!codeVal.trim()) return;
          var loc = { id: uid(), code: codeVal.trim(), label: labelVal.trim() };
          db.locations.push(loc);
          saveDB(db);
          if (onCreated) onCreated(loc);
          closeModal();
        }
      }, ["Add location"]);
      return [
        el("label", { class: "field" }, [el("span", {}, ["Location code"]), codeInput]),
        el("label", { class: "field" }, [el("span", {}, ["Description (optional)"]), labelInput]),
        el("div", { class: "modal-actions" }, [
          saveBtn,
          el("button", { class: "btn btn-ghost", onClick: closeModal }, ["Cancel"])
        ])
      ];
    }
    return modalShell("Add a location", body());
  }

  function addItemModal() {
    var sku = "", name = "", category = "";
    var rows = [{ id: uid(), size: "", locationId: "", qty: "" }];

    function computeCanSave() {
      return !!(name.trim() && rows.some(function (r) { return r.size.trim() && r.locationId && r.qty !== "" && Number(r.qty) >= 0; }));
    }

    function refreshButton() {
      var btn = document.getElementById("save-product-btn");
      if (btn) btn.disabled = !computeCanSave();
    }

    function body() {
      var skuInput = el("input", { placeholder: "TSH-001", value: sku, onInput: function (e) { sku = e.target.value; } });
      var catInput = el("input", { placeholder: "T-Shirts", value: category, onInput: function (e) { category = e.target.value; } });
      var nameInput = el("input", { placeholder: "Classic Crew Tee", value: name, onInput: function (e) { name = e.target.value; refreshButton(); } });

      var rowsWrap = el("div", {});
      rows.forEach(function (r, idx) {
        var isCustom = r.size !== "" && SIZE_PRESETS.indexOf(r.size) === -1;

        var sizeSelect = el("select", {
          onChange: function (e) {
            if (e.target.value === "__custom__") {
              r.size = r._customDraft || "";
              r._useCustom = true;
            } else {
              r.size = e.target.value;
              r._useCustom = false;
            }
            refreshButton();
            ui.modal = modalShell("Add a product", body());
            render();
          }
        }, [el("option", { value: "" }, ["Select size…"])].concat(
          SIZE_PRESETS.map(function (sz) {
            var opt = el("option", { value: sz }, [sz]);
            if (r.size === sz && !r._useCustom) opt.selected = true;
            return opt;
          })
        ).concat([
          (function () {
            var opt = el("option", { value: "__custom__" }, ["Custom…"]);
            if (r._useCustom || isCustom) opt.selected = true;
            return opt;
          })()
        ]));

        var customInput = null;
        if (r._useCustom || isCustom) {
          customInput = el("input", {
            placeholder: "Custom size", value: r.size,
            onInput: function (e) { r.size = e.target.value; r._customDraft = e.target.value; refreshButton(); }
          });
        }

        var qtyInput = el("input", {
          type: "number", min: "0", placeholder: "Qty", value: r.qty,
          onInput: function (e) { r.qty = e.target.value; refreshButton(); }
        });
        var locSelect = el("select", {
          onChange: function (e) {
            if (e.target.value === "__new__") {
              ui.modal = addLocationModal(function (newLoc) {
                r.locationId = newLoc.id;
                ui.modal = modalShell("Add a product", body());
                render();
              });
              render();
              return;
            }
            r.locationId = e.target.value;
            refreshButton();
          }
        }, [el("option", { value: "" }, ["Select location…"])].concat(
          db.locations.map(function (l) {
            var opt = el("option", { value: l.id }, [l.code + (l.label ? " — " + l.label : "")]);
            if (l.id === r.locationId) opt.selected = true;
            return opt;
          })
        ).concat([el("option", { value: "__new__" }, ["+ New location…"])]));

        var removeBtn = el("button", {
          class: "icon-btn",
          onClick: function () {
            rows = rows.filter(function (x) { return x.id !== r.id; });
            ui.modal = modalShell("Add a product", body());
            render();
          }
        }, ["🗑"]);
        if (rows.length === 1) removeBtn.disabled = true;

        rowsWrap.appendChild(el("div", { class: "row" + (customInput ? " row-with-custom" : "") }, [
          sizeSelect, qtyInput, locSelect,
          customInput,
          el("div", { class: "row-bottom" }, [removeBtn])
        ]));
      });

      var addRowBtn = el("button", {
        class: "btn btn-ghost btn-sm",
        onClick: function () {
          rows.push({ id: uid(), size: "", locationId: "", qty: "" });
          ui.modal = modalShell("Add a product", body());
          render();
        }
      }, ["+ Add another size / location"]);

      var canSave = computeCanSave();
      var saveBtn = el("button", {
        class: "btn btn-primary",
        id: "save-product-btn",
        onClick: function () {
          if (!computeCanSave()) return;
          var item = { id: uid(), sku: sku.trim(), name: name.trim(), category: category.trim(), createdAt: Date.now() };
          db.items.push(item);
          rows.forEach(function (r) {
            if (!r.size.trim() || !r.locationId || r.qty === "") return;
            db.stock.push({ id: uid(), itemId: item.id, locationId: r.locationId, size: r.size.trim(), qty: Number(r.qty) });
            logActivity("added", item.id, item.name, r.size.trim(), Number(r.qty));
          });
          saveDB(db);
          closeModal();
        }
      }, ["Save product"]);
      if (!canSave) saveBtn.disabled = true;

      return [
        el("div", { class: "grid-2" }, [
          el("label", { class: "field" }, [el("span", {}, ["SKU (optional)"]), skuInput]),
          el("label", { class: "field" }, [el("span", {}, ["Category (optional)"]), catInput])
        ]),
        el("label", { class: "field" }, [el("span", {}, ["Product name"]), nameInput]),
        rowsWrap,
        addRowBtn,
        el("div", { class: "modal-actions" }, [
          saveBtn,
          el("button", { class: "btn btn-ghost", onClick: closeModal }, ["Cancel"])
        ])
      ];
    }

    return modalShell("Add a product", body());
  }

  // First: is this a magic-link callback? If so, handle it and stop —
  // the page will reload once the session is stored.
  var isAuthCallback = checkAuthCallback();

  if (!isAuthCallback) {
    if (!getAuthSession()) {
      renderLogin();
    } else if (!unlocked) {
      renderLock();
    } else {
      render();
      initialSync();
    }
  }

  // Pull remote changes periodically so other devices' edits show up here too.
  // Skipped while a modal is open, so it never clobbers an in-progress edit.
  setInterval(function () {
    if (getAuthSession() && unlocked && !syncInFlight && !ui.modal) {
      pullFromSupabase().catch(function (err) {
        console.error(err);
        setSyncStatus(navigator.onLine ? "error" : "offline", err.message);
      });
    }
  }, 20000);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
