<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StockMap Inventory</title>
<meta name="description" content="Track exactly where each size is stored, by location." />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1B2430" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="StockMap" />
<style>
  :root {
    --ink: #1B2430; --amber: #E8A33D; --amber-deep: #C97F1E;
    --paper: #F2F0EA; --slate: #5C6470; --green: #4A7C59; --red: #B5493A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--paper); }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: var(--ink); }

  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px;
            background: var(--ink); color: var(--paper); position: sticky; top: 0; z-index: 20; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark { background: var(--amber); color: var(--ink); width: 34px; height: 34px; border-radius: 8px;
                display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; flex-shrink: 0; }
  .brand-title { font-weight: 700; letter-spacing: .06em; font-size: 15px; }
  .brand-sub { font-size: 10.5px; color: #9AA5B5; }
  .topbar-actions { display: flex; gap: 8px; }

  button { font-family: inherit; }
  .btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600;
         padding: 9px 12px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; }
  .btn:disabled { opacity: .4; }
  .btn-primary { background: var(--amber); color: var(--ink); }
  .btn-ghost { background: transparent; color: var(--paper); border-color: rgba(242,240,234,.3); }
  .modal-actions .btn-ghost { color: var(--ink); border-color: #D8D4C8; }
  .btn-sm { padding: 6px 10px; font-size: 12px; }
  .btn-full { width: 100%; justify-content: center; }

  .stats-strip { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: #DAD6C9; }
  .stat { background: var(--paper); padding: 12px 16px; }
  .stat-num { font-size: 22px; font-weight: 700; display: block; }
  .stat-label { font-size: 10.5px; color: var(--slate); text-transform: uppercase; }
  .stat-warn .stat-num { color: var(--red); }

  .filters { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 0; }
  .search-box { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #DAD6C9;
                border-radius: 8px; padding: 10px 12px; }
  .search-box input { border: none; outline: none; flex: 1; font-size: 15px; background: transparent; }
  .filters select { border: 1px solid #DAD6C9; border-radius: 8px; padding: 10px; font-size: 14px; background: #fff; width: 100%; }

  .content { padding: 16px; }
  .card { background: #fff; border: 1px solid #E4E0D3; border-radius: 12px; padding: 16px; margin-bottom: 14px; position: relative; }
  .card-actions-top { position: absolute; top: 10px; right: 10px; display: flex; gap: 2px; }
  .card-head { display: flex; align-items: flex-start; gap: 10px; padding-bottom: 12px; padding-right: 56px;
               border-bottom: 1px dashed #E4E0D3; margin-bottom: 12px; flex-wrap: wrap; }
  .card-eyebrow { font-size: 10.5px; color: var(--slate); text-transform: uppercase; }
  .card-title { font-size: 17px; margin: 2px 0 0; font-weight: 700; }
  .card-total { margin-left: auto; text-align: right; }
  .card-total-num { font-size: 20px; font-weight: 700; color: var(--amber-deep); display: block; }
  .card-total-label { font-size: 10px; color: var(--slate); text-transform: uppercase; }
  .sold-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .sold-chip { display: flex; align-items: center; gap: 8px; background: #F4F2EC; border: 1px solid #E4E0D3;
               border-radius: 20px; padding: 4px 6px 4px 10px; font-size: 11.5px; }
  .sold-chip-size { font-weight: 700; color: var(--ink); }

  .sold-total-banner { display: flex; flex-direction: column; align-items: center; background: #F4F2EC;
                        border-radius: 10px; padding: 16px; margin-bottom: 18px; }
  .sold-total-num { font-size: 26px; font-weight: 700; color: var(--amber-deep); }
  .sold-total-label { font-size: 11px; color: var(--slate); text-transform: uppercase; margin-top: 2px; }
  .sold-block { margin-bottom: 16px; }
  .sold-block-title { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }

  .loc-row { display: grid; grid-template-columns: 90px 1fr 32px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .loc-row input { border: 1px solid #DAD6C9; border-radius: 6px; padding: 9px; font-size: 14px; outline: none; }
  .loc-row input:first-child { font-weight: 700; text-transform: uppercase; }
  .loc-add-form { background: #FAF9F5; border: 1px solid #EEEAE0; border-radius: 8px; padding: 12px; margin: 6px 0 4px; }
  .loc-add-form .field { margin-bottom: 10px; }

  .size-group { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
  .size-badge { min-width: 36px; height: 36px; background: var(--ink); color: var(--paper); border-radius: 8px;
                display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0; }
  .bintag-row { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
  .bintag-wrap { display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .bintag { position: relative; background: repeating-linear-gradient(135deg,#FFF7E8,#FFF7E8 6px,#FCEFD4 6px,#FCEFD4 12px);
            border: 1.5px solid var(--amber-deep); border-radius: 6px; padding: 6px 10px 6px 14px; min-width: 80px; text-align: center; }
  .bintag-notch { position: absolute; left: -5px; top: 50%; transform: translateY(-50%); width: 9px; height: 9px;
                  background: var(--paper); border: 1.5px solid var(--amber-deep); border-radius: 50%; }
  .bintag-code { font-weight: 700; font-size: 12.5px; }
  .bintag-label { font-size: 9.5px; color: var(--slate); }
  .bintag-meta { display: flex; align-items: center; gap: 4px; }

  .pill { font-size: 10.5px; font-weight: 600; padding: 3px 7px; border-radius: 20px; background: #EAF2EC; color: var(--green); }
  .pill-low { background: #FCEEDC; color: var(--amber-deep); }
  .pill-out { background: #F8E4E0; color: var(--red); }

  .qty-stepper { display: inline-flex; align-items: center; gap: 2px; background: #EAF2EC; border-radius: 20px; padding: 2px; }
  .qty-stepper.qty-low { background: #FCEEDC; }
  .qty-stepper.qty-out { background: #F8E4E0; }
  .stepper-btn { width: 22px; height: 22px; border-radius: 50%; background: #fff; font-weight: 700; font-size: 14px;
                 display: flex; align-items: center; justify-content: center; padding: 0; color: var(--ink); line-height: 1; }
  .stepper-btn:disabled { opacity: .35; }
  .stepper-input { width: 34px; text-align: center; border: none; background: transparent; font-size: 12px; font-weight: 700;
                    color: inherit; outline: none; -moz-appearance: textfield; padding: 0; }
  .stepper-input::-webkit-outer-spin-button, .stepper-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .icon-btn { background: transparent; border: none; cursor: pointer; color: var(--slate);
              display: inline-flex; align-items: center; justify-content: center; padding: 6px; border-radius: 6px; font-size: 15px; }
  .icon-btn.tiny { padding: 2px; font-size: 12px; }
  .icon-btn:disabled { opacity: .3; }

  .empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 60px 20px; gap: 10px; color: var(--slate); }
  .empty-state h2 { color: var(--ink); margin: 6px 0 0; font-size: 18px; }
  .empty-state p { max-width: 320px; font-size: 13.5px; line-height: 1.5; margin: 0 0 8px; }
  .empty-inline { text-align: center; padding: 40px 0; color: var(--slate); font-size: 13.5px; }

  .save-indicator { position: fixed; bottom: 12px; right: 14px; font-size: 10.5px;
                     color: var(--slate); background: #fff; border: 1px solid #E4E0D3; padding: 4px 9px; border-radius: 20px; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(27,36,48,.55); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal { background: #fff; border-radius: 16px 16px 0 0; width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid #EEEAE0; position: sticky; top: 0; background: #fff; }
  .modal-head h3 { margin: 0; font-size: 16px; }
  .modal-body { padding: 16px 18px 22px; }

  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; font-size: 12px; color: var(--slate); font-weight: 600; }
  .field input, .field select { border: 1px solid #DAD6C9; border-radius: 8px; padding: 11px; font-size: 16px; color: var(--ink); outline: none; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; padding: 10px; background: #FAF9F5; border-radius: 8px; border: 1px solid #EEEAE0; }
  .row input, .row select { border: 1px solid #DAD6C9; border-radius: 6px; padding: 9px; font-size: 15px; outline: none; }
  .row select { grid-column: 1 / -1; }
  .row-bottom { display: flex; gap: 8px; grid-column: 1 / -1; align-items: center; justify-content: flex-end; }

  .modal-actions { display: flex; flex-direction: column-reverse; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid #EEEAE0; }
  .modal-actions .btn { width: 100%; justify-content: center; }

  .lock-screen { max-width: 320px; margin: 15vh auto 0; padding: 24px; text-align: center; }
  .lock-screen h2 { margin: 0 0 6px; font-size: 19px; }
  .lock-sub { font-size: 13px; color: var(--slate); line-height: 1.5; margin: 0 0 18px; }
  .lock-input { width: 100%; text-align: center; font-size: 26px; letter-spacing: 10px; padding: 14px;
                border: 1px solid #DAD6C9; border-radius: 10px; margin-bottom: 14px; outline: none; }
  .lock-input:focus { border-color: var(--amber-deep); }
  .lock-error { color: var(--red); font-size: 12.5px; margin: -6px 0 12px; }
</style>
</head>
<body>

<div id="app"></div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "stockmap_db_v1";
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  var PIN_KEY = "stockmap_pin_v1";
  var unlocked = sessionStorage.getItem("stockmap_unlocked") === "1";

  function getSavedPin() {
    try { return localStorage.getItem(PIN_KEY) || ""; } catch (e) { return ""; }
  }
  function setSavedPin(pin) {
    try { localStorage.setItem(PIN_KEY, pin); } catch (e) {}
  }

  function renderLock() {
    var root = document.getElementById("app");
    root.innerHTML = "";
    var hasPin = !!getSavedPin();
    var val = "";
    var errorMsg = "";

    function body() {
      var wrap = el("div", { class: "lock-screen" }, [
        el("div", { class: "brand-mark", style: "margin:0 auto 16px;width:48px;height:48px;font-size:20px;" }, ["S"]),
        el("h2", {}, [hasPin ? "Enter PIN" : "Set a PIN"]),
        el("p", { class: "lock-sub" }, [
          hasPin
            ? "Enter the PIN to unlock this inventory."
            : "Choose a PIN to protect this inventory. You'll need it each time you open the app."
        ]),
        el("input", {
          class: "lock-input",
          type: "tel", inputmode: "numeric", placeholder: "••••",
          value: val,
          onInput: function (e) { val = e.target.value.replace(/[^0-9]/g, ""); e.target.value = val; },
          id: "pin-input"
        }),
        errorMsg ? el("p", { class: "lock-error" }, [errorMsg]) : null,
        el("button", {
          class: "btn btn-primary btn-full",
          onClick: function () {
            if (!val.trim()) return;
            if (hasPin) {
              if (val === getSavedPin()) {
                sessionStorage.setItem("stockmap_unlocked", "1");
                render();
              } else {
                errorMsg = "Incorrect PIN. Try again.";
                renderInner();
              }
            } else {
              if (val.length < 4) {
                errorMsg = "Use at least 4 digits.";
                renderInner();
                return;
              }
              setSavedPin(val);
              sessionStorage.setItem("stockmap_unlocked", "1");
              render();
            }
          }
        }, [hasPin ? "Unlock" : "Set PIN & continue"])
      ]);
      return wrap;
    }

    function renderInner() {
      root.innerHTML = "";
      root.appendChild(body());
    }
    renderInner();
  }



  function loadDB() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (!parsed.sold) parsed.sold = [];
        if (!parsed.items) parsed.items = [];
        if (!parsed.locations) parsed.locations = [];
        if (!parsed.stock) parsed.stock = [];
        return parsed;
      }
    } catch (e) {}
    return { items: [], locations: [], stock: [], sold: [] };
  }
  function saveDB(db) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) {}
  }

  var db = loadDB();
  var ui = { query: "", locationFilter: "", modal: null };

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    for (var key in attrs) {
      if (key === "class") node.className = attrs[key];
      else if (key === "html") node.innerHTML = attrs[key];
      else if (key.indexOf("on") === 0 && typeof attrs[key] === "function") {
        node.addEventListener(key.slice(2).toLowerCase(), attrs[key]);
      } else if (key === "value") node.value = attrs[key];
      else node.setAttribute(key, attrs[key]);
    }
    (children || []).forEach(function (c) {
      if (c === null || c === undefined) return;
      if (typeof c === "string") node.appendChild(document.createTextNode(c));
      else node.appendChild(c);
    });
    return node;
  }

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function render() {
    var root = document.getElementById("app");
    root.innerHTML = "";
    root.appendChild(buildApp());
    if (ui.modal) root.appendChild(ui.modal());
  }

  function totalUnits() { return db.stock.reduce(function (s, r) { return s + r.qty; }, 0); }
  function lowCount() { return db.stock.filter(function (r) { return r.qty <= 3; }).length; }
  function locationsById() {
    var map = {};
    db.locations.forEach(function (l) { map[l.id] = l; });
    return map;
  }

  function filteredItems() {
    var q = ui.query.trim().toLowerCase();
    return db.items.filter(function (it) {
      var matchesQuery = !q ||
        it.name.toLowerCase().indexOf(q) !== -1 ||
        (it.sku || "").toLowerCase().indexOf(q) !== -1 ||
        (it.category || "").toLowerCase().indexOf(q) !== -1;
      var rows = db.stock.filter(function (s) { return s.itemId === it.id; });
      var matchesLoc = !ui.locationFilter || rows.some(function (r) { return r.locationId === ui.locationFilter; });
      return matchesQuery && matchesLoc;
    });
  }

  function buildApp() {
    var shell = el("div", {}, [
      buildTopbar(),
      buildStats(),
      buildFilters(),
      buildContent(),
      el("div", { class: "save-indicator" }, ["Saved on this device"])
    ]);
    return shell;
  }

  function buildTopbar() {
    return el("header", { class: "topbar" }, [
      el("div", { class: "brand" }, [
        el("div", { class: "brand-mark" }, ["S"]),
        el("div", {}, [
          el("div", { class: "brand-title" }, ["STOCKMAP"]),
          el("div", { class: "brand-sub" }, ["size & location tracker"])
        ])
      ]),
      el("div", { class: "topbar-actions" }, [
        el("button", {
          class: "btn btn-ghost",
          onClick: function () {
            sessionStorage.removeItem("stockmap_unlocked");
            unlocked = false;
            renderLock();
          }
        }, ["🔒"]),
        el("button", { class: "btn btn-ghost", onClick: function () { ui.modal = manageLocationsModal(); render(); } }, ["📍"]),
        el("button", { class: "btn btn-ghost", onClick: function () { ui.modal = soldModal(); render(); } }, ["🧾"]),
        el("button", { class: "btn btn-primary", onClick: function () { ui.modal = addItemModal(); render(); } }, ["+ Add"])
      ])
    ]);
  }

  function buildStats() {
    function stat(num, label, warn) {
      return el("div", { class: "stat" + (warn ? " stat-warn" : "") }, [
        el("span", { class: "stat-num" }, [String(num)]),
        el("span", { class: "stat-label" }, [label])
      ]);
    }
    return el("div", { class: "stats-strip" }, [
      stat(db.items.length, "Products"),
      stat(db.locations.length, "Locations"),
      stat(totalUnits(), "Total units"),
      stat(lowCount(), "Low / out lines", true)
    ]);
  }

  function buildFilters() {
    var searchInput = el("input", {
      placeholder: "Search product, SKU, category…",
      value: ui.query,
      onInput: function (e) { ui.query = e.target.value; renderContentOnly(); }
    });
    var select = el("select", {
      onChange: function (e) { ui.locationFilter = e.target.value; renderContentOnly(); }
    }, [el("option", { value: "" }, ["All locations"])].concat(
      db.locations.map(function (l) {
        var opt = el("option", { value: l.id }, [l.code + (l.label ? " — " + l.label : "")]);
        if (l.id === ui.locationFilter) opt.selected = true;
        return opt;
      })
    ));
    return el("div", { class: "filters", id: "filters" }, [
      el("div", { class: "search-box" }, [el("span", {}, ["🔍"]), searchInput]),
      select
    ]);
  }

  function renderContentOnly() {
    var old = document.getElementById("content-area");
    if (old) old.replaceWith(buildContent());
  }

  function buildContent() {
    var wrap = el("main", { class: "content", id: "content-area" });
    if (db.items.length === 0) {
      wrap.appendChild(emptyState());
      return wrap;
    }
    var items = filteredItems();
    if (items.length === 0) {
      wrap.appendChild(el("div", { class: "empty-inline" }, ["No products match your search."]));
      return wrap;
    }
    var locMap = locationsById();
    items.forEach(function (item) {
      var rows = db.stock.filter(function (s) { return s.itemId === item.id; });
      wrap.appendChild(itemCard(item, rows, locMap));
    });
    return wrap;
  }

  function emptyState() {
    return el("div", { class: "empty-state" }, [
      el("div", {}, ["📦"]),
      el("h2", {}, ["No products yet"]),
      el("p", {}, ["Add your first product, give it sizes, and pin exactly which shelf, rack, or bin each size lives in."]),
      el("button", { class: "btn btn-primary", onClick: function () { ui.modal = addItemModal(); render(); } }, ["+ Add your first product"])
    ]);
  }

  function stockPill(qty) {
    var cls = "pill";
    var prefix = "";
    if (qty === 0) { cls += " pill-out"; prefix = "⚠ "; }
    else if (qty <= 3) { cls += " pill-low"; }
    return el("span", { class: cls }, [prefix + qty + " " + (qty === 1 ? "unit" : "units")]);
  }

  function recordSale(row, amount) {
    if (amount <= 0) return;
    var existing = db.sold.find(function (s) { return s.itemId === row.itemId && s.size === row.size; });
    if (existing) {
      existing.qty += amount;
    } else {
      db.sold.push({ id: uid(), itemId: row.itemId, size: row.size, qty: amount });
    }
  }

  function updateQty(row, newQty) {
    newQty = Math.max(0, Math.floor(Number(newQty) || 0));
    var diff = row.qty - newQty;
    if (diff > 0) recordSale(row, diff);
    row.qty = newQty;
    saveDB(db);
    render();
  }

  function qtyStepper(row) {
    var minusBtn = el("button", {
      class: "icon-btn tiny stepper-btn",
      onClick: function () { updateQty(row, row.qty - 1); }
    }, ["−"]);
    if (row.qty <= 0) minusBtn.disabled = true;

    var qtyInput = el("input", {
      class: "stepper-input",
      type: "number", min: "0", value: row.qty,
      onInput: function (e) {
        row.qty = Math.max(0, Math.floor(Number(e.target.value) || 0));
      },
      onBlur: function (e) { updateQty(row, e.target.value); },
      onClick: function (e) { e.stopPropagation(); }
    });

    var plusBtn = el("button", {
      class: "icon-btn tiny stepper-btn",
      onClick: function () { updateQty(row, row.qty + 1); }
    }, ["+"]);

    var wrap = el("div", { class: "qty-stepper" + (row.qty === 0 ? " qty-out" : row.qty <= 3 ? " qty-low" : "") }, [
      minusBtn, qtyInput, plusBtn
    ]);
    return wrap;
  }

  function updateSold(soldEntry, newQty) {
    newQty = Math.max(0, Math.floor(Number(newQty) || 0));
    soldEntry.qty = newQty;
    saveDB(db);
    if (ui.modal) {
      ui.modal = soldModal();
    }
    render();
  }

  function soldStepper(soldEntry) {
    var minusBtn = el("button", {
      class: "icon-btn tiny stepper-btn",
      onClick: function () { updateSold(soldEntry, soldEntry.qty - 1); }
    }, ["−"]);
    if (soldEntry.qty <= 0) minusBtn.disabled = true;

    var qtyInput = el("input", {
      class: "stepper-input",
      type: "number", min: "0", value: soldEntry.qty,
      onInput: function (e) { soldEntry.qty = Math.max(0, Math.floor(Number(e.target.value) || 0)); },
      onBlur: function (e) { updateSold(soldEntry, e.target.value); },
      onClick: function (e) { e.stopPropagation(); }
    });

    var plusBtn = el("button", {
      class: "icon-btn tiny stepper-btn",
      onClick: function () { updateSold(soldEntry, soldEntry.qty + 1); }
    }, ["+"]);

    return el("div", { class: "qty-stepper" }, [minusBtn, qtyInput, plusBtn]);
  }

  function itemCard(item, rows, locMap) {
    var card = el("div", { class: "card" }, [
      el("div", { class: "card-actions-top" }, [
        el("button", {
          class: "icon-btn",
          onClick: function () { ui.modal = editItemModal(item); render(); }
        }, ["✏️"]),
        el("button", {
          class: "icon-btn",
          onClick: function () {
            db.items = db.items.filter(function (i) { return i.id !== item.id; });
            db.stock = db.stock.filter(function (s) { return s.itemId !== item.id; });
            db.sold = db.sold.filter(function (s) { return s.itemId !== item.id; });
            saveDB(db);
            render();
          }
        }, ["🗑"])
      ]),
      el("div", { class: "card-head" }, [
        el("div", {}, [
          el("div", { class: "card-eyebrow" }, [(item.sku || "NO-SKU") + (item.category ? " · " + item.category : "")]),
          el("h3", { class: "card-title" }, [item.name])
        ]),
        el("div", { class: "card-total" }, [
          el("span", { class: "card-total-num" }, [String(rows.reduce(function (s, r) { return s + r.qty; }, 0))]),
          el("span", { class: "card-total-label" }, ["total units"])
        ])
      ])
    ]);

    var byLocation = {};
    rows.forEach(function (r) {
      if (!byLocation[r.locationId]) byLocation[r.locationId] = [];
      byLocation[r.locationId].push(r);
    });
    var locKeys = Object.keys(byLocation).sort(function (a, b) {
      var la = locMap[a], lb = locMap[b];
      var ca = la ? la.code : "";
      var cb = lb ? lb.code : "";
      return ca < cb ? -1 : ca > cb ? 1 : 0;
    });

    locKeys.forEach(function (locId) {
      var loc = locMap[locId];
      var sizeRow = el("div", { class: "bintag-row" });
      byLocation[locId]
        .slice()
        .sort(function (a, b) { return a.size < b.size ? -1 : a.size > b.size ? 1 : 0; })
        .forEach(function (r) {
          sizeRow.appendChild(el("div", { class: "bintag-wrap" }, [
            el("div", { class: "size-badge" }, [r.size]),
            el("div", { class: "bintag-meta" }, [
              qtyStepper(r),
              el("button", {
                class: "icon-btn tiny",
                onClick: function () {
                  db.stock = db.stock.filter(function (s) { return s.id !== r.id; });
                  saveDB(db);
                  render();
                }
              }, ["✕"])
            ])
          ]));
        });
      card.appendChild(el("div", { class: "size-group" }, [
        el("div", { class: "bintag" }, [
          el("div", { class: "bintag-notch" }),
          el("div", { class: "bintag-code" }, [loc ? loc.code : "?"]),
          loc && loc.label ? el("div", { class: "bintag-label" }, [loc.label]) : null
        ]),
        sizeRow
      ]));
    });

    return card;
  }

  // ---------- Modals ----------

  function closeModal() { ui.modal = null; render(); }

  function modalShell(title, bodyChildren) {
    return function () {
      return el("div", { class: "modal-backdrop", onClick: function (e) { if (e.target === e.currentTarget) closeModal(); } }, [
        el("div", { class: "modal" }, [
          el("div", { class: "modal-head" }, [
            el("h3", {}, [title]),
            el("button", { class: "icon-btn", onClick: closeModal }, ["✕"])
          ]),
          el("div", { class: "modal-body" }, bodyChildren)
        ])
      ]);
    };
  }

  function editItemModal(item) {
    var sku = item.sku || "", name = item.name || "", category = item.category || "";

    function body() {
      var skuInput = el("input", { placeholder: "TSH-001", value: sku, onInput: function (e) { sku = e.target.value; } });
      var catInput = el("input", { placeholder: "T-Shirts", value: category, onInput: function (e) { category = e.target.value; } });
      var nameInput = el("input", {
        placeholder: "Classic Crew Tee", value: name,
        onInput: function (e) {
          name = e.target.value;
          var btn = document.getElementById("save-edit-btn");
          if (btn) btn.disabled = !name.trim();
        }
      });

      var itemRows = db.stock.filter(function (s) { return s.itemId === item.id; });
      var rowsWrap = el("div", {});

      itemRows.forEach(function (r) {
        var sizeInput = el("input", {
          placeholder: "Size (e.g. M)", value: r.size,
          onInput: function (e) { r.size = e.target.value; },
          onBlur: function () { saveDB(db); }
        });
        var qtyInput = el("input", {
          type: "number", min: "0", placeholder: "Qty", value: r.qty,
          onInput: function (e) { r.qty = Math.max(0, Math.floor(Number(e.target.value) || 0)); },
          onBlur: function () { saveDB(db); }
        });
        var locSelect = el("select", {
          onChange: function (e) {
            r.locationId = e.target.value;
            saveDB(db);
          }
        }, db.locations.map(function (l) {
          var opt = el("option", { value: l.id }, [l.code + (l.label ? " — " + l.label : "")]);
          if (l.id === r.locationId) opt.selected = true;
          return opt;
        }));

        var removeBtn = el("button", {
          class: "icon-btn",
          onClick: function () {
            db.stock = db.stock.filter(function (s) { return s.id !== r.id; });
            saveDB(db);
            ui.modal = editItemModal(item);
            render();
          }
        }, ["🗑"]);

        rowsWrap.appendChild(el("div", { class: "row" }, [
          sizeInput, qtyInput, locSelect,
          el("div", { class: "row-bottom" }, [removeBtn])
        ]));
      });

      if (itemRows.length === 0) {
        rowsWrap.appendChild(el("p", { class: "lock-sub", style: "margin:0 0 12px;" }, ["No sizes/locations for this product yet."]));
      }

      var addRowBtn = el("button", {
        class: "btn btn-ghost btn-sm",
        onClick: function () {
          if (db.locations.length === 0) {
            ui.modal = addLocationModal(function (newLoc) {
              db.stock.push({ id: uid(), itemId: item.id, locationId: newLoc.id, size: "", qty: 0 });
              saveDB(db);
              ui.modal = editItemModal(item);
              render();
            });
            render();
            return;
          }
          db.stock.push({ id: uid(), itemId: item.id, locationId: db.locations[0].id, size: "", qty: 0 });
          saveDB(db);
          ui.modal = editItemModal(item);
          render();
        }
      }, ["+ Add size / location"]);

      var saveBtn = el("button", {
        class: "btn btn-primary",
        id: "save-edit-btn",
        onClick: function () {
          if (!name.trim()) return;
          item.sku = sku.trim();
          item.name = name.trim();
          item.category = category.trim();
          saveDB(db);
          closeModal();
        }
      }, ["Save changes"]);
      if (!name.trim()) saveBtn.disabled = true;

      return [
        el("div", { class: "grid-2" }, [
          el("label", { class: "field" }, [el("span", {}, ["SKU (optional)"]), skuInput]),
          el("label", { class: "field" }, [el("span", {}, ["Category (optional)"]), catInput])
        ]),
        el("label", { class: "field" }, [el("span", {}, ["Product name"]), nameInput]),
        el("div", { class: "field" }, [el("span", {}, ["Sizes & locations"])]),
        rowsWrap,
        addRowBtn,
        el("div", { class: "modal-actions" }, [
          saveBtn,
          el("button", { class: "btn btn-ghost", onClick: closeModal }, ["Cancel"])
        ])
      ];
    }

    return modalShell("Edit product", body());
  }

  function soldModal() {
    function body() {
      var itemsWithSales = db.items.filter(function (item) {
        return db.sold.some(function (s) { return s.itemId === item.id; });
      });

      if (itemsWithSales.length === 0) {
        return [
          el("div", { class: "empty-state", style: "padding:30px 10px;" }, [
            el("div", {}, ["🧾"]),
            el("h2", {}, ["No sales yet"]),
            el("p", {}, ["When you reduce stock quantity, it's logged here as sold. You'll be able to see and edit totals per product and size."])
          ]),
          el("div", { class: "modal-actions" }, [
            el("button", { class: "btn btn-primary", onClick: closeModal }, ["Close"])
          ])
        ];
      }

      var totalSold = db.sold.reduce(function (s, r) { return s + r.qty; }, 0);
      var wrap = el("div", {}, [
        el("div", { class: "sold-total-banner" }, [
          el("span", { class: "sold-total-num" }, [String(totalSold)]),
          el("span", { class: "sold-total-label" }, ["total units sold"])
        ])
      ]);

      itemsWithSales.forEach(function (item) {
        var entries = db.sold.filter(function (s) { return s.itemId === item.id; });
        var block = el("div", { class: "sold-block" }, [
          el("div", { class: "sold-block-title" }, [item.name + (item.sku ? " · " + item.sku : "")])
        ]);
        var row = el("div", { class: "sold-row" });
        entries
          .slice()
          .sort(function (a, b) { return a.size < b.size ? -1 : a.size > b.size ? 1 : 0; })
          .forEach(function (s) {
            row.appendChild(el("div", { class: "sold-chip" }, [
              el("span", { class: "sold-chip-size" }, [s.size]),
              soldStepper(s)
            ]));
          });
        block.appendChild(row);
        wrap.appendChild(block);
      });

      wrap.appendChild(el("div", { class: "modal-actions" }, [
        el("button", { class: "btn btn-primary", onClick: closeModal }, ["Close"])
      ]));

      return [wrap];
    }

    return modalShell("Sold", body());
  }

  function manageLocationsModal(initialAddingNew) {
    var addingNew = !!initialAddingNew;
    var newCode = "", newLabel = "";

    function body() {
      var listWrap = el("div", {});

      db.locations
        .slice()
        .sort(function (a, b) { return a.code < b.code ? -1 : a.code > b.code ? 1 : 0; })
        .forEach(function (loc) {
          var codeInput = el("input", {
            value: loc.code,
            onInput: function (e) { loc.code = e.target.value.toUpperCase(); e.target.value = loc.code; },
            onBlur: function () { if (loc.code.trim()) saveDB(db); }
          });
          var labelInput = el("input", {
            value: loc.label || "",
            placeholder: "Description (optional)",
            onInput: function (e) { loc.label = e.target.value; },
            onBlur: function () { saveDB(db); }
          });
          var deleteBtn = el("button", {
            class: "icon-btn",
            onClick: function () {
              var inUse = db.stock.some(function (s) { return s.locationId === loc.id; });
              if (inUse && !window.confirm("This location has stock assigned to it. Delete anyway? Stock entries at this location will be removed too.")) return;
              db.locations = db.locations.filter(function (l) { return l.id !== loc.id; });
              db.stock = db.stock.filter(function (s) { return s.locationId !== loc.id; });
              saveDB(db);
              ui.modal = manageLocationsModal();
              render();
            }
          }, ["🗑"]);

          listWrap.appendChild(el("div", { class: "loc-row" }, [
            codeInput, labelInput, deleteBtn
          ]));
        });

      if (db.locations.length === 0) {
        listWrap.appendChild(el("p", { class: "lock-sub", style: "margin:0 0 14px;" }, ["No locations yet — add one below."]));
      }

      var children = [listWrap];

      if (addingNew) {
        var newCodeInput = el("input", {
          placeholder: "e.g. A1-03",
          value: newCode,
          onInput: function (e) { newCode = e.target.value.toUpperCase(); e.target.value = newCode; }
        });
        var newLabelInput = el("input", {
          placeholder: "e.g. Warehouse A, Rack 1, Shelf 3",
          value: newLabel,
          onInput: function (e) { newLabel = e.target.value; }
        });
        var confirmAddBtn = el("button", {
          class: "btn btn-primary btn-sm",
          onClick: function () {
            if (!newCode.trim()) return;
            db.locations.push({ id: uid(), code: newCode.trim(), label: newLabel.trim() });
            saveDB(db);
            ui.modal = manageLocationsModal();
            render();
          }
        }, ["Add"]);
        children.push(el("div", { class: "loc-add-form" }, [
          el("label", { class: "field" }, [el("span", {}, ["New location code"]), newCodeInput]),
          el("label", { class: "field" }, [el("span", {}, ["Description (optional)"]), newLabelInput]),
          confirmAddBtn
        ]));
      } else {
        children.push(el("button", {
          class: "btn btn-ghost btn-sm",
          onClick: function () {
            ui.modal = manageLocationsModal(true);
            render();
          }
        }, ["+ Add new location"]));
      }

      children.push(el("div", { class: "modal-actions" }, [
        el("button", { class: "btn btn-primary", onClick: closeModal }, ["Done"])
      ]));

      return children;
    }

    return modalShell("Manage locations", body());
  }

  function addLocationModal(onCreated) {
    var codeVal = "", labelVal = "";
    function body() {
      var codeInput = el("input", {
        placeholder: "e.g. A1-03",
        value: codeVal,
        onInput: function (e) { codeVal = e.target.value.toUpperCase(); e.target.value = codeVal; }
      });
      var labelInput = el("input", {
        placeholder: "e.g. Warehouse A, Rack 1, Shelf 3",
        value: labelVal,
        onInput: function (e) { labelVal = e.target.value; }
      });
      var saveBtn = el("button", {
        class: "btn btn-primary",
        onClick: function () {
          if (!codeVal.trim()) return;
          var loc = { id: uid(), code: codeVal.trim(), label: labelVal.trim() };
          db.locations.push(loc);
          saveDB(db);
          if (onCreated) onCreated(loc);
          closeModal();
        }
      }, ["Add location"]);
      return [
        el("label", { class: "field" }, [el("span", {}, ["Location code"]), codeInput]),
        el("label", { class: "field" }, [el("span", {}, ["Description (optional)"]), labelInput]),
        el("div", { class: "modal-actions" }, [
          saveBtn,
          el("button", { class: "btn btn-ghost", onClick: closeModal }, ["Cancel"])
        ])
      ];
    }
    return modalShell("Add a location", body());
  }

  function addItemModal() {
    var sku = "", name = "", category = "";
    var rows = [{ id: uid(), size: "", locationId: "", qty: "" }];

    function computeCanSave() {
      return !!(name.trim() && rows.some(function (r) { return r.size.trim() && r.locationId && r.qty !== "" && Number(r.qty) >= 0; }));
    }

    function refreshButton() {
      var btn = document.getElementById("save-product-btn");
      if (btn) btn.disabled = !computeCanSave();
    }

    function body() {
      var skuInput = el("input", { placeholder: "TSH-001", value: sku, onInput: function (e) { sku = e.target.value; } });
      var catInput = el("input", { placeholder: "T-Shirts", value: category, onInput: function (e) { category = e.target.value; } });
      var nameInput = el("input", { placeholder: "Classic Crew Tee", value: name, onInput: function (e) { name = e.target.value; refreshButton(); } });

      var rowsWrap = el("div", {});
      rows.forEach(function (r, idx) {
        var sizeInput = el("input", {
          placeholder: "Size (e.g. M)", value: r.size,
          onInput: function (e) { r.size = e.target.value; refreshButton(); }
        });
        var qtyInput = el("input", {
          type: "number", min: "0", placeholder: "Qty", value: r.qty,
          onInput: function (e) { r.qty = e.target.value; refreshButton(); }
        });
        var locSelect = el("select", {
          onChange: function (e) {
            if (e.target.value === "__new__") {
              ui.modal = addLocationModal(function (newLoc) {
                r.locationId = newLoc.id;
                ui.modal = modalShell("Add a product", body());
                render();
              });
              render();
              return;
            }
            r.locationId = e.target.value;
            refreshButton();
          }
        }, [el("option", { value: "" }, ["Select location…"])].concat(
          db.locations.map(function (l) {
            var opt = el("option", { value: l.id }, [l.code + (l.label ? " — " + l.label : "")]);
            if (l.id === r.locationId) opt.selected = true;
            return opt;
          })
        ).concat([el("option", { value: "__new__" }, ["+ New location…"])]));

        var removeBtn = el("button", {
          class: "icon-btn",
          onClick: function () {
            rows = rows.filter(function (x) { return x.id !== r.id; });
            ui.modal = modalShell("Add a product", body());
            render();
          }
        }, ["🗑"]);
        if (rows.length === 1) removeBtn.disabled = true;

        rowsWrap.appendChild(el("div", { class: "row" }, [
          sizeInput, qtyInput, locSelect,
          el("div", { class: "row-bottom" }, [removeBtn])
        ]));
      });

      var addRowBtn = el("button", {
        class: "btn btn-ghost btn-sm",
        onClick: function () {
          rows.push({ id: uid(), size: "", locationId: "", qty: "" });
          ui.modal = modalShell("Add a product", body());
          render();
        }
      }, ["+ Add another size / location"]);

      var canSave = computeCanSave();
      var saveBtn = el("button", {
        class: "btn btn-primary",
        id: "save-product-btn",
        onClick: function () {
          if (!computeCanSave()) return;
          var item = { id: uid(), sku: sku.trim(), name: name.trim(), category: category.trim(), createdAt: Date.now() };
          db.items.push(item);
          rows.forEach(function (r) {
            if (!r.size.trim() || !r.locationId || r.qty === "") return;
            db.stock.push({ id: uid(), itemId: item.id, locationId: r.locationId, size: r.size.trim(), qty: Number(r.qty) });
          });
          saveDB(db);
          closeModal();
        }
      }, ["Save product"]);
      if (!canSave) saveBtn.disabled = true;

      return [
        el("div", { class: "grid-2" }, [
          el("label", { class: "field" }, [el("span", {}, ["SKU (optional)"]), skuInput]),
          el("label", { class: "field" }, [el("span", {}, ["Category (optional)"]), catInput])
        ]),
        el("label", { class: "field" }, [el("span", {}, ["Product name"]), nameInput]),
        rowsWrap,
        addRowBtn,
        el("div", { class: "modal-actions" }, [
          saveBtn,
          el("button", { class: "btn btn-ghost", onClick: closeModal }, ["Cancel"])
        ])
      ];
    }

    return modalShell("Add a product", body());
  }

  if (!unlocked) {
    renderLock();
  } else {
    render();
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
